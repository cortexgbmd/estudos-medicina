<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIP P2 — Banco de Questões</title>
<style>
:root {
  --bg: #0f1115; --bg-elev: #171a21; --bg-soft: #1e222b; --text: #e6e8ee;
  --text-dim: #a5a9b5; --text-muted: #737885; --border: #262a33;
  --accent: #6ea8ff; --accent-soft: #1b2b4a;
  --correct: #8ec07c; --correct-bg: #1e2d1c; --wrong: #ef6f6c; --wrong-bg: #2d1e1e;
  --highlight-bg: #1d2329; --highlight-border: #f6c177;
}
[data-theme="light"] {
  --bg: #fafafa; --bg-elev: #fff; --bg-soft: #f2f3f5; --text: #1a1c22;
  --text-dim: #4a4e59; --text-muted: #6c717c; --border: #e4e6eb;
  --accent: #2e5fcf; --accent-soft: #e8efff;
  --correct: #2f7d32; --correct-bg: #e6f4e6; --wrong: #c23c3c; --wrong-bg: #fbe9e9;
  --highlight-bg: #fff8ec; --highlight-border: #d48f1f;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 900px; margin: 0 auto; padding: 32px 24px 120px; }
header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.3px; }
header p { margin: 0; color: var(--text-dim); font-size: 14px; }
.controls {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 20px; padding: 14px; background: var(--bg-elev);
  border-radius: 10px; border: 1px solid var(--border);
}
.controls label { font-size: 13px; color: var(--text-dim); margin-right: 6px; }
.controls select, .controls button {
  background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
  padding: 7px 11px; border-radius: 6px; font-size: 13px; cursor: pointer;
  font-family: inherit;
}
.controls button:hover { background: var(--border); }
.controls button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls button.primary:hover { filter: brightness(1.1); }
.mode-banner {
  padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  background: var(--accent-soft); color: var(--accent); font-size: 13px;
  border: 1px solid var(--accent); font-weight: 500;
}
.quest {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 22px; margin-bottom: 18px;
}
.quest .qmeta {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px;
}
.quest .qmeta .dif { padding: 2px 8px; border-radius: 20px; background: var(--bg-soft); }
.quest .qmeta .dif.facil { color: var(--correct); }
.quest .qmeta .dif.medio { color: var(--highlight-border); }
.quest .qmeta .dif.dificil { color: var(--wrong); }
.quest .num { font-weight: 700; color: var(--text); }
.quest .stem { margin-bottom: 14px; }
.quest .stem p { margin: 0 0 8px; }
.quest .stem strong { color: var(--text); }
.quest .alts { list-style: none; padding: 0; margin: 0; }
.quest .alts li { margin: 6px 0; }
.quest .alts label {
  display: flex; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: background .15s;
  background: var(--bg); font-size: 15px; line-height: 1.5;
}
.quest .alts label:hover { background: var(--bg-soft); }
.quest .alts input[type="radio"] { margin-top: 3px; accent-color: var(--accent); }
.quest .alts .letter { font-weight: 700; min-width: 18px; color: var(--text-dim); }
.quest.answered .alts label.chosen { border-color: var(--accent); }
.quest.answered .alts label.correct { border-color: var(--correct); background: var(--correct-bg); }
.quest.answered .alts label.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.quest.answered .alts label { cursor: default; }
.quest.answered .alts input { pointer-events: none; }
.explain {
  margin-top: 14px; padding: 12px 16px;
  background: var(--bg-soft); border-radius: 8px; border-left: 3px solid var(--accent);
  font-size: 14.5px; display: none;
}
.quest.answered .explain { display: block; }
.explain strong { color: var(--text); }
.explain .e-correct { color: var(--correct); font-weight: 600; }
.explain .e-wrong { color: var(--wrong); font-weight: 600; }
.explain h4 { margin: 10px 0 4px; font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
.diss {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 22px; margin-bottom: 18px;
}
.diss .caso { margin-bottom: 14px; }
.diss .caso p { margin: 6px 0; }
.diss .perguntas { padding-left: 22px; }
.diss .perguntas li { margin-bottom: 8px; }
.diss .reveal-btn {
  background: var(--bg-soft); color: var(--accent); border: 1px solid var(--accent);
  padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  margin-top: 12px; font-family: inherit;
}
.diss .reveal-btn:hover { background: var(--accent); color: #fff; }
.diss .gabarito {
  margin-top: 14px; padding: 14px 18px;
  background: var(--accent-soft); border-radius: 8px;
  border-left: 3px solid var(--accent); display: none;
}
.diss.revealed .gabarito { display: block; }
.diss .gabarito h4 { margin: 12px 0 4px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; }
.diss .gabarito h4:first-child { margin-top: 0; }
.simulado-results {
  display: none; background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; margin-bottom: 22px;
}
.simulado-results.show { display: block; }
.simulado-results h2 { margin: 0 0 10px; font-size: 22px; }
.score { font-size: 32px; font-weight: 700; color: var(--accent); margin: 6px 0; }
.score-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; font-size: 14px; }
.score-breakdown .box { background: var(--bg-soft); padding: 10px 12px; border-radius: 6px; }
.score-breakdown .box strong { display: block; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.diag-panel { background: var(--bg-soft); padding: 14px 18px; border-radius: 8px; margin-top: 12px; }
.diag-panel h3 { margin: 0 0 10px; font-size: 15px; color: var(--text); }
.diag-panel .item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.diag-panel .item:last-child { border: none; }
.diag-panel .item .top { display: flex; justify-content: space-between; align-items: center; }
.diag-panel .item .top b { color: var(--text); }
.diag-panel .item .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
nav.indice {
  position: sticky; top: 12px; background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px;
}
nav.indice summary { cursor: pointer; font-weight: 600; color: var(--text); }
nav.indice details[open] summary { margin-bottom: 8px; }
nav.indice a { color: var(--accent); text-decoration: none; margin-right: 14px; display: inline-block; margin-top: 4px; }
nav.indice a:hover { text-decoration: underline; }
h2.aula-sep { margin: 32px 0 14px; font-size: 20px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.theme-toggle {
  position: fixed; bottom: 16px; right: 16px; background: var(--bg-soft);
  color: var(--text); border: 1px solid var(--border); padding: 8px 12px;
  border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
}
.hidden { display: none !important; }
@media (max-width: 700px) { .app { padding: 18px 14px 100px; } .score-breakdown { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="app">

<header>
  <h1>Banco de Questões — DIP P2</h1>
  <p>6 aulas · 60 questões objetivas · 10 dissertativas. Estilo ENADE/ENAMED. Teste-se em modo estudo (feedback imediato) ou simulado (resultado no final).</p>
</header>

<div class="controls">
  <label>Modo</label>
  <select id="modeSel">
    <option value="estudo">Modo Estudo (feedback imediato)</option>
    <option value="simulado">Modo Simulado (resultado no final)</option>
  </select>
  <label>Filtro</label>
  <select id="filterSel">
    <option value="todas">Todas as aulas</option>
    <option value="a1">Aula 1 — Epidemiologia</option>
    <option value="a2">Aula 2 — FOI</option>
    <option value="a3">Aula 3 — Hepatites/Cirrose</option>
    <option value="a4">Aula 4 — Hepatite A</option>
    <option value="a5">Aula 5 — Leishmaniose</option>
    <option value="a6">Aula 6 — Hepatite C</option>
  </select>
  <button id="applyBtn" class="primary">Aplicar</button>
  <button id="resetBtn">Limpar respostas</button>
  <button id="submitBtn" class="primary hidden">Finalizar simulado</button>
</div>

<div id="modeBanner" class="mode-banner">Modo Estudo — responda cada questão e o feedback aparece na hora.</div>

<nav class="indice">
  <details>
    <summary>Índice de questões por aula</summary>
    <div id="idxContent"></div>
  </details>
</nav>

<div id="simResults" class="simulado-results"></div>

<div id="questList"></div>

<h2 class="aula-sep" id="diss-section">Questões dissertativas</h2>
<div id="dissList"></div>

</div>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☾ Tema claro</button>

<script>
const QUESTOES = [
  // ============ AULA 1 — EPIDEMIOLOGIA (10 questões) ============
  {id:1, aula:"a1", topic:"epi-mortalidade", dif:"facil", stem:"Em um hospital, 200 pacientes foram diagnosticados com uma determinada doença infecciosa ao longo de um mês, e 20 deles foram a óbito nesse período. Para descrever a gravidade dessa doença entre os afetados, o indicador adequado é",
    alts:["Incidência acumulada.","Prevalência instantânea.","Taxa de mortalidade geral.","Letalidade.","Mortalidade proporcional."],
    correct:3,
    exp:{correct:"Letalidade = óbitos ÷ doentes confirmados × 100. Responde 'quão grave é a doença para quem a contraiu' (aqui, 20/200 = 10%).",
      wrongs:["Incidência mede casos novos sobre população exposta; não captura mortalidade entre os que adoeceram.","Prevalência mede quantos têm a doença num momento; não trata de óbitos.","Mortalidade geral usa a população total como denominador, não os doentes — não mede gravidade entre afetados.","Correta.","Mortalidade proporcional é o percentual de um tipo de óbito sobre o total de mortes; não informa a gravidade específica da doença entre os doentes."]}},

  {id:2, aula:"a1", topic:"epi-morbidade", dif:"facil", stem:"Um pesquisador deseja estimar, em um município de 50 000 habitantes, <strong>quantas pessoas vivem hoje com hipertensão arterial</strong>, doença de evolução crônica. O indicador epidemiológico mais apropriado para esse objetivo é",
    alts:["Taxa de mortalidade específica.","Prevalência.","Coeficiente de letalidade.","Mortalidade proporcional.","Incidência anual."],
    correct:1,
    exp:{correct:"Prevalência mede casos totais (novos + antigos) num momento, sendo o indicador de escolha para doenças crônicas como a hipertensão.",
      wrongs:["Mortalidade específica mede óbitos, não adoecimento, e é medida sobre causas específicas.","Correta.","Letalidade avalia a mortalidade entre os doentes, não a frequência da doença.","Mortalidade proporcional descreve o perfil de causas de morte, não a frequência de uma doença na população.","Incidência mede apenas casos novos em um período — inadequada para condição crônica já estabelecida."]}},

  {id:3, aula:"a1", topic:"epi-definicoes", dif:"medio", stem:"Em uma creche de bairro, no intervalo de duas semanas, são identificados seis casos confirmados de varicela entre crianças que compartilham a mesma sala. A classificação epidemiológica adequada para esse evento é",
    alts:["Endemia, pois a varicela circula habitualmente no Brasil.","Epidemia, pois o número de casos ultrapassa o limiar epidêmico municipal.","Surto, pois há casos com relação epidemiológica em espaço delimitado.","Pandemia, pois a varicela tem distribuição global.","Caso esporádico sem relevância epidemiológica."], correct:2,
    exp:{correct:"Surto é a ocorrência de dois ou mais casos com relação epidemiológica entre si, em espaço delimitado (escola, creche, quartel). Mesmo poucos casos configuram surto se estiverem agrupados.",
      wrongs:["Endemia exige ocorrência sistemática e contínua na população ao longo do tempo, não um agregado pontual em creche.","Epidemia refere-se a elevação em área mais ampla acima do limiar esperado — o critério é regional, não restrito a uma creche.","Correta.","Pandemia é disseminação mundial sustentada de doença nova; não se aplica a casos localizados.","Seis casos com relação epidemiológica e espaço delimitado não são esporádicos — formam surto por definição."]}},

  {id:4, aula:"a1", topic:"epi-definicoes", dif:"medio", stem:"Um gestor de saúde argumenta que a tuberculose no Brasil é uma endemia. A justificativa epidemiológica mais adequada para essa afirmação é",
    alts:["Foram identificados dois ou mais casos em um mesmo ambiente delimitado.","A tuberculose apresentou elevação súbita da incidência em 2024 acima do esperado.","A doença tem disseminação mundial com transmissão sustentada de pessoa a pessoa em diferentes continentes.","A doença ocorre sistematicamente na população, com incidência relativamente constante ao longo do tempo, permitindo variações sazonais.","A doença apresenta letalidade superior a 50% entre os casos confirmados."],
    correct:3,
    exp:{correct:"Endemia é definida pela ocorrência sistemática e relativamente constante de uma doença em determinada população e espaço, temporalmente ilimitada, com possíveis variações cíclicas/sazonais.",
      wrongs:["Casos em ambiente delimitado caracterizam surto, não endemia.","Elevação súbita acima do esperado caracteriza epidemia, não endemia.","Disseminação mundial sustentada define pandemia.","Correta.","Letalidade alta caracteriza a gravidade da doença entre os afetados, não o padrão de distribuição endêmica."]}},

  {id:5, aula:"a1", topic:"epi-mortalidade", dif:"medio", stem:"Uma gestora analisa os óbitos de um município e identifica que 40% das mortes se devem a doenças cardiovasculares, 18% a neoplasias, 10% a causas externas e os demais a outras causas. Esse tipo de análise corresponde a",
    alts:["Mortalidade proporcional (Índice de Swaroop-Uemura).","Taxa de letalidade por doença cardiovascular.","Taxa de incidência por causa de morte.","Prevalência por causa cardiovascular.","Coeficiente de mortalidade específica por causa."],
    correct:0,
    exp:{correct:"A mortalidade proporcional (Swaroop-Uemura) expressa cada causa de óbito como percentual do total de mortes, retratando o perfil epidemiológico da comunidade.",
      wrongs:["Correta.","Letalidade mede a mortalidade entre os doentes de uma doença, não entre os óbitos gerais.","Incidência refere-se a casos novos da doença, não a distribuição de óbitos.","Prevalência refere-se a casos existentes de uma doença, não a mortes.","A mortalidade específica divide óbitos por uma causa pela população em risco — precisa de denominador populacional, não percentual sobre total de óbitos."]}},

  {id:6, aula:"a1", topic:"epi-mortalidade", dif:"medio", stem:"Uma gestante de 32 semanas sofre atropelamento na via pública e falece por traumatismo. Durante a notificação, um residente pergunta se esse óbito entra no indicador de mortalidade materna. A resposta correta é",
    alts:["Sim, pois ocorreu durante a gestação, independentemente da causa.","Não, pois o óbito não foi por causa relacionada ao ciclo gravídico-puerperal.","Sim, pois o feto também foi afetado pelo evento.","Não, porque a gestante tinha menos de 37 semanas.","Sim, todo óbito em gestante é contabilizado como materna."],
    correct:1,
    exp:{correct:"A mortalidade materna refere-se a óbitos por causas relacionadas à gravidez, parto ou puerpério. Morte por trauma externo, sem relação causal com o ciclo, não é computada.",
      wrongs:["O fato de ocorrer durante a gestação não basta; é preciso relação causal com a gravidez.","Correta.","A contabilização de mortalidade materna considera a causa da morte materna, e não o desfecho fetal.","A idade gestacional não é o critério; o critério é causal, não temporal.","Nem todo óbito em gestante entra no indicador — o critério é causa relacionada ao ciclo gravídico-puerperal."]}},

  {id:7, aula:"a1", topic:"epi-morbidade", dif:"medio", stem:"Em um serviço de vigilância, observa-se que a dengue apresenta grande aumento de casos novos durante o verão na região Sudeste. Para descrever esse fenômeno sazonal, o indicador adequado é",
    alts:["Mortalidade proporcional.","Incidência.","Mortalidade geral.","Prevalência anual.","Letalidade específica."],
    correct:1,
    exp:{correct:"Incidência mede casos novos em um período e é ideal para doenças agudas com comportamento sazonal, como a dengue no verão.",
      wrongs:["Mortalidade proporcional trata do perfil de óbitos, não da ocorrência da doença.","Correta.","Mortalidade geral mede óbitos na população, não casos novos de dengue.","Prevalência mede todos os casos em um momento — é mais adequada para doenças crônicas.","Letalidade mede a mortalidade entre os doentes; não captura o volume de novos casos."]}},

  {id:8, aula:"a1", topic:"epi-mortalidade", dif:"dificil", stem:"O indicador de mortalidade infantil neonatal reflete, preferencialmente, a qualidade de",
    alts:["Acesso a saneamento básico e coleta de lixo domiciliar.","Programas de imunização da infância tardia.","Assistência ao pré-natal e ao parto, além das primeiras horas de vida.","Taxa de fecundidade e planejamento familiar.","Cobertura vacinal da adolescência."], correct:2,
    exp:{correct:"A mortalidade neonatal (óbitos de menores de 28 dias) reflete especialmente a qualidade do pré-natal, da assistência ao parto e dos cuidados iniciais do recém-nascido.",
      wrongs:["Saneamento influencia mais a mortalidade pós-neonatal (28 dias a 1 ano), ligada a gastroenterites e doenças respiratórias.","Imunização da infância tardia atinge faixas acima do período neonatal.","Correta.","Fecundidade e planejamento familiar afetam natalidade e fatores sociais, mas não são o principal reflexo do período neonatal.","Cobertura vacinal de adolescentes não tem relação direta com o período neonatal."]}},

  {id:9, aula:"a1", topic:"epi-definicoes", dif:"dificil", stem:"A pandemia de SARS-CoV-2 (2020) foi caracterizada formalmente a partir do momento em que a doença apresentou",
    alts:["Ocorrência sistemática e constante em uma dada população.","Letalidade superior a 5% em múltiplas regiões do mundo.","Elevação acima do limiar epidêmico em um único país.","Transmissão sustentada de pessoa a pessoa em diferentes continentes.","Incidência concentrada em idosos de todas as continentes."],
    correct:3,
    exp:{correct:"Pandemia é a disseminação mundial de uma nova doença caracterizada por transmissão sustentada de pessoa a pessoa em diferentes continentes.",
      wrongs:["Ocorrência constante define endemia.","Letalidade não é critério para classificar pandemia — pandemia refere-se a distribuição geográfica, não gravidade.","Elevação em um único país é epidemia local.","Correta.","Distribuição por faixa etária não é critério definidor de pandemia."]}},

  {id:10, aula:"a1", topic:"epi-morbidade", dif:"dificil", stem:"Em um estudo epidemiológico, uma cidade de 100 000 habitantes tem 8 000 pessoas vivendo com diabetes tipo 2, com 200 novos diagnósticos no ano. Assinale a afirmação correta sobre a interpretação desses dados.",
    alts:["A prevalência é de 8% e a incidência anual é de 0,2%, padrão compatível com doença crônica acumulativa.","A incidência é de 8% e a prevalência de 0,2%, padrão compatível com surto.","Os dados não permitem calcular nenhum dos dois indicadores.","Tanto incidência quanto prevalência estão corretamente expressas em percentual de óbitos.","A incidência é de 8% e a prevalência é de 0,2%, caracterizando doença aguda."],
    correct:0,
    exp:{correct:"Prevalência = casos totais/população = 8 000/100 000 = 8%. Incidência anual = novos/população = 200/100 000 = 0,2%/ano. Prevalência alta com incidência baixa é típico de doença crônica que se acumula.",
      wrongs:["Correta.","Os valores estão trocados; além disso, 8% de prevalência não caracteriza surto.","Os dados fornecidos são suficientes para ambos os cálculos.","Nenhum dos dois indicadores se expressa como percentual de óbitos.","Os valores estão trocados — 8 000 existentes é prevalência, 200 novos é incidência."]}},

  // ============ AULA 2 — FEBRE DE ORIGEM INDETERMINADA (10 questões) ============
  {id:11, aula:"a2", topic:"foi-fisiopat", dif:"facil", stem:"Na fisiopatologia da febre, o principal mediador hipotalâmico responsável pela elevação do set point de temperatura é",
    alts:["Histamina liberada por mastócitos.","Serotonina de origem neuronal central.","Prostaglandina E2 produzida sob estímulo de citocinas.","Bradicinina gerada durante a resposta inflamatória sistêmica.","Norepinefrina do sistema simpático."], correct:2,
    exp:{correct:"As citocinas inflamatórias (IL-1, IL-6, TNF) chegam ao hipotálamo e estimulam a produção de prostaglandina E2, que eleva o set point do termostato hipotalâmico.",
      wrongs:["Histamina relaciona-se a reações alérgicas e vasodilatação local, não à elevação do set point térmico.","Serotonina tem funções neurológicas diversas, mas não é o mediador central da febre.","Correta.","Bradicinina atua em dor e vasodilatação locais, não na regulação do set point.","Norepinefrina contribui em respostas de estresse, mas não é o mediador do set point febril."]}},

  {id:12, aula:"a2", topic:"foi-fisiopat", dif:"facil", stem:"Homem de 28 anos apresenta, após exercício intenso em dia de calor extremo, confusão mental, pele quente e seca e temperatura axilar de 40,5 °C. Sobre a fisiopatologia desse quadro, é correto afirmar que",
    alts:["O set point hipotalâmico está elevado, como ocorre em toda febre infecciosa.","O antitérmico (paracetamol) é a medida terapêutica de eleição.","O set point está normal e o problema é desequilíbrio entre produção/perda de calor, caracterizando hipertermia.","Trata-se de febre de origem indeterminada, por duração prolongada inexplicada.","A resposta adequada envolve sobretudo inibição da prostaglandina E2."], correct:2,
    exp:{correct:"Na hipertermia (golpe de calor, por exemplo), o set point hipotalâmico não é alterado; o problema é mecânico/ambiental. A conduta é resfriamento físico.",
      wrongs:["Na hipertermia, o set point está normal — não há mediação por PGE2.","Antitérmicos atuam reduzindo PGE2; como o set point já está normal, não funcionam na hipertermia — o tratamento é resfriamento físico ativo.","Correta.","FOI exige ≥ 3 semanas de febre com investigação prévia sem diagnóstico — incompatível com quadro agudo de exposição ambiental.","A inibição de PGE2 não se aplica à hipertermia, pois o set point já está normal."]}},

  {id:13, aula:"a2", topic:"foi-conceito", dif:"medio", stem:"Qual das situações abaixo preenche os critérios clássicos de febre de origem indeterminada (FOI)?",
    alts:["Paciente com febre recente e coriza, em domicílio, sem outras queixas.","Paciente com febre de 37,6 °C por duas semanas com hemograma normal.","Paciente com febre ≥ 38,3 °C por mais de 3 semanas, sem diagnóstico após 3 dias de internação.","Paciente com febre há 5 dias sem investigação laboratorial.","Paciente com hipertermia pós-exercício e confusão mental."],
    correct:2,
    exp:{correct:"FOI clássica: temperatura ≥ 38,3 °C, duração &gt; 3 semanas, sem diagnóstico definido após 3 dias de internação (ou 3 consultas ambulatoriais).",
      wrongs:["Febre recente com coriza sugere quadro viral agudo, não FOI.","Temperatura abaixo de 38,3 °C não preenche o critério térmico.","Correta.","Duração insuficiente e ausência de investigação prévia exclui FOI.","Hipertermia pós-exercício é quadro agudo e mecânico, não FOI."]}},

  {id:14, aula:"a2", topic:"foi-conceito", dif:"medio", stem:"Paciente internado há 5 dias por pielonefrite em tratamento com ceftriaxona, com boa evolução inicial, desenvolve no quinto dia febre de 38,7 °C sem novo foco aparente. A melhor classificação desse quadro é",
    alts:["Febre de origem inflamatória autoimune.","FOI clássica.","FOI relacionada à imunodeficiência.","FOI nosocomial.","FOI associada ao HIV."],
    correct:3,
    exp:{correct:"FOI nosocomial ocorre em paciente hospitalizado que não tinha febre na admissão e a desenvolve após ≥ 48 h, sem diagnóstico após 3 dias de investigação.",
      wrongs:["Há pontos clínicos sugestivos de causa infecciosa, mas a apresentação se encaixa na definição nosocomial.","FOI clássica aplica-se a pacientes da comunidade, não hospitalizados no momento do início da febre.","FOI relacionada à imunodeficiência exige estado de imunossupressão não mencionado.","Correta.","FOI associada ao HIV requer infecção por HIV documentada."]}},

  {id:15, aula:"a2", topic:"foi-etiologia", dif:"medio", stem:"Sobre a distribuição dos diagnósticos etiológicos em pacientes com febre de origem indeterminada, pode-se afirmar que",
    alts:["As doenças autoimunes respondem, em média, por mais de 50% dos casos.","As infecções são a categoria mais comum, respondendo por 30–50% dos casos.","As neoplasias são responsáveis por mais de 60% dos casos em qualquer idade.","O diagnóstico de febre factícia é o mais frequente em adultos.","A maioria dos casos corresponde a infecções virais autolimitadas de vias aéreas."], correct:1,
    exp:{correct:"A distribuição mais aceita aponta infecções em 30–50%, seguidas por neoplasias/hematológicas e autoimunes (10–30% cada) e miscelânea (20–40%).",
      wrongs:["Autoimunes ficam em 10–30%, não em maioria dos casos.","Correta.","Neoplasias são causa importante (10–30%), mas não predominam.","Febre factícia é causa rara, não a principal.","FOI exige investigação prévia sem diagnóstico; viroses autolimitadas não se enquadram, pois durariam menos que 3 semanas."]}},

  {id:16, aula:"a2", topic:"foi-investigacao", dif:"medio", stem:"Sobre a abordagem de investigação da febre de origem indeterminada, é correto afirmar que",
    alts:["Existe algoritmo padronizado de investigação, independente do paciente.","A biópsia hepática deve ser realizada antes dos exames laboratoriais iniciais.","A investigação deve ser guiada pelas hipóteses levantadas na anamnese e exame físico, priorizando medidas menos invasivas.","Antibioticoterapia empírica de amplo espectro deve ser iniciada em todos os casos ao diagnóstico.","A ultrassonografia abdominal não contribui para o diagnóstico em FOI."], correct:2,
    exp:{correct:"Não há algoritmo único em FOI: a investigação é individualizada, dirigida por hipóteses e prioriza medidas menos invasivas antes das mais invasivas.",
      wrongs:["Não existe fórmula; a investigação é individualizada.","Exames laboratoriais e de imagem menos invasivos precedem biópsias e procedimentos invasivos.","Correta.","O tratamento em FOI é direcionado à causa; empirismo é exceção reservada a deterioração clínica.","A ultrassonografia abdominal é exame útil e não invasivo, frequentemente incluído na investigação inicial."]}},

  {id:17, aula:"a2", topic:"foi-tratamento", dif:"medio", stem:"Sobre o tratamento empírico em pacientes com febre de origem indeterminada, é correto afirmar que",
    alts:["É contraindicado em qualquer circunstância.","Deve ser reservado para pacientes cuja condição clínica está deteriorando, sendo orientado pela epidemiologia e quadro clínico mais provável.","Deve ser iniciado sempre com associação de corticoide e antibiótico de amplo espectro.","Deve ser suspenso assim que a temperatura normaliza, independentemente de diagnóstico etiológico.","Deve ser iniciado em todos os casos, para evitar progressão."],
    correct:1,
    exp:{correct:"Em FOI, o tratamento deve ser direcionado à causa. A exceção é o paciente com deterioração clínica, quando o tratamento empírico é norteado pela epidemiologia e quadro mais provável.",
      wrongs:["Pode ser necessário em pacientes que pioram clinicamente, como exceção.","Correta.","Associação de corticoide e antibiótico sem hipótese é inadequada e pode piorar o paciente.","Suspender tratamento baseado apenas em normalização da temperatura ignora a causa; conduta errada mesmo em casos empíricos.","Tratamento empírico indiscriminado pode mascarar o diagnóstico e prejudicar a investigação."]}},

  {id:18, aula:"a2", topic:"foi-fisiopat", dif:"medio", stem:"Paciente com diagnóstico de endocardite bacteriana apresenta febre contínua elevada, fadiga e calafrios. O papel funcional da febre na resposta imune desse paciente inclui, entre outros,",
    alts:["Produção de bradicinina e broncoconstrição seletiva.","Eliminação de amônia pela barreira hematoencefálica.","Redução da quimiotaxia e inibição de fagocitose, para evitar hiperativação.","Aumento da atividade bactericida celular e da resposta dos linfócitos B.","Vasoconstrição periférica sustentada e hipertensão arterial prolongada."],
    correct:3,
    exp:{correct:"A febre aumenta mecanismos de defesa: quimiotaxia, fagocitose, atividade bactericida celular e resposta dos linfócitos B.",
      wrongs:["Bradicinina participa de dor e inflamação local, não é efeito central da febre.","A eliminação de amônia envolve fígado e rim, não a resposta febril.","A febre aumenta — não reduz — quimiotaxia e fagocitose.","Correta.","A febre em si não produz hipertensão prolongada; pode haver taquicardia, mas não vasoconstrição sustentada como mecanismo central."]}},

  {id:19, aula:"a2", topic:"foi-curva", dif:"dificil", stem:"Uma curva febril caracterizada por picos de febre alta intercalados com períodos em que a temperatura retorna ao normal, em intervalos razoavelmente previsíveis, é típica de",
    alts:["Hepatite aguda medicamentosa.","Infecção urinária complicada.","Tuberculose miliar.","Artrite reumatoide em atividade.","Malária."],
    correct:4,
    exp:{correct:"A curva febril intermitente — picos seguidos de retorno à temperatura normal — é classicamente associada à malária, refletindo o ciclo de replicação parasitária.",
      wrongs:["Hepatite aguda medicamentosa pode cursar com febre, mas sem o padrão intermitente periódico.","ITU complicada pode dar febre alta com calafrios, porém sem o padrão intermitente periódico com afebrilia absoluta.","Tuberculose clássica cursa com febre vespertina diária (não intermitente entre picos e normalidade).","AR pode dar febre, mas sem padrão intermitente característico descrito.","Correta."]}},

  {id:20, aula:"a2", topic:"foi-fisiopat", dif:"dificil", stem:"Um plantonista prescreve paracetamol para um paciente em estado de golpe de calor, com temperatura de 41 °C, ambiente quente e pele seca. Sobre essa conduta, é correto afirmar que",
    alts:["É adequada, desde que se combine com ácido acetilsalicílico em dose plena.","É indiferente, pois qualquer antitérmico reduz a temperatura corporal igualmente em todas as situações.","É inadequada apenas se houver alergia documentada ao paracetamol.","É adequada, pois o paracetamol inibe a prostaglandina E2 e baixará a temperatura.","É inadequada, pois na hipertermia o set point hipotalâmico está normal e antitérmicos não atuam — a conduta correta é resfriamento físico ativo."],
    correct:4,
    exp:{correct:"No golpe de calor (hipertermia), o set point está normal — antitérmicos não funcionam. O tratamento é resfriamento físico (gelo, compressas, banho frio) e reposição volêmica.",
      wrongs:["Associar AAS em golpe de calor pode ser deletério (sangramento, disfunção plaquetária) e não resolve o problema mecânico.","Antitérmicos não atuam em hipertermia — a mecânica fisiopatológica é diferente da febre.","O problema não é alergia, mas o fato de que antitérmicos não têm ação em hipertermia com set point normal.","Paracetamol só tem efeito quando o set point está elevado; não baixa temperatura em hipertermia.","Correta."]}},

  // ============ AULA 3 — HEPATITES E CIRROSE (12 questões) ============
  {id:21, aula:"a3", topic:"hep-def", dif:"facil", stem:"Sobre o conceito de hepatite e cirrose, assinale a afirmação correta.",
    alts:["Cirrose e hepatite são sinônimos e podem ser usados de modo intercambiável.","Hepatite é processo exclusivamente viral de inflamação hepática.","Cirrose refere-se a inflamação reversível do fígado.","Hepatite é inflamação do fígado e pode ser aguda (com remissão ou fulminação) ou crônica (com risco de cirrose, insuficiência hepática e hepatocarcinoma).","Hepatite aguda tem maior risco de evolução para cirrose do que a hepatite crônica."],
    correct:3,
    exp:{correct:"Hepatite é inflamação do fígado, por causas diversas. Aguda pode evoluir para cura ou fulminação; crônica pode evoluir para cirrose, insuficiência hepática e hepatocarcinoma.",
      wrongs:["São entidades distintas: hepatite é inflamação; cirrose é o estágio final de fibrose avançada.","Hepatite tem várias causas além de viral (álcool, medicamentosa, autoimune, parasitária, metabólica).","Cirrose é processo irreversível de substituição fibrosa com nódulos regenerativos.","Correta.","Cirrose resulta de estímulo inflamatório prolongado — portanto, tipicamente da hepatite crônica, não da aguda."]}},

  {id:22, aula:"a3", topic:"hep-etiologia", dif:"facil", stem:"A principal causa de hepatite crônica é",
    alts:["Hepatite autoimune.","Esquistossomose hepatoesplênica.","Doença de Wilson.","Hepatite medicamentosa por paracetamol.","Uso abusivo de álcool."],
    correct:4,
    exp:{correct:"O uso abusivo crônico de álcool é a principal causa de hepatite crônica; pode progredir para insuficiência hepática e cirrose.",
      wrongs:["Correta.","A esquistossomose causa fibrose periportal com hipertensão portal, mas sua prevalência como causa de hepatite crônica é bem menor que a do álcool.","Doença de Wilson é causa rara de hepatopatia crônica.","Hepatite medicamentosa é tipicamente aguda; entre as agudas tem o maior risco de fulminação, mas não é a principal causa de hepatite crônica.","Hepatite autoimune existe, mas tem prevalência menor que a alcoólica."]}},

  {id:23, aula:"a3", topic:"cir-hipertensao-portal", dif:"medio", stem:"Homem de 60 anos, cirrótico por álcool, tem ascite volumosa, circulação colateral em abdome, esplenomegalia e varizes de esôfago em endoscopia. A explicação fisiopatológica comum para todos esses achados é",
    alts:["Redução da função das células de Kupffer.","Insuficiência renal aguda secundária à síndrome hepatorrenal.","Aumento da resistência ao fluxo sanguíneo no sistema portal.","Deficiência isolada de fatores de coagulação, com sangramento por consumo.","Carcinoma hepatocelular produzindo alfa-fetoproteína."],
    correct:2,
    exp:{correct:"Todos esses achados decorrem da hipertensão portal: o fígado fibrótico aumenta a resistência ao fluxo portal, forçando o desvio do sangue por anastomoses portossistêmicas (ascite, colateral, esplenomegalia, varizes).",
      wrongs:["Redução da função de Kupffer contribui à imunopatogenia, mas não explica as varizes e a ascite.","A síndrome hepatorrenal decorre das alterações hemodinâmicas da cirrose, mas não explica a ascite e as varizes simultaneamente.","Correta.","Coagulopatia existe, mas não justifica esplenomegalia nem varizes.","CHC é complicação, não o mecanismo comum das manifestações da hipertensão portal."]}},

  {id:24, aula:"a3", topic:"cir-hipertensao-portal", dif:"medio", stem:"As varizes de esôfago, uma das complicações da cirrose, resultam diretamente de",
    alts:["Atrofia muscular de esôfago por desnutrição.","Extravasamento de plasma para a cavidade peritoneal.","Redução de pressão oncótica pela hipoalbuminemia.","Desvio de fluxo portal para veias esofágicas através de anastomoses portossistêmicas.","Compressão extrínseca pela esplenomegalia."],
    correct:3,
    exp:{correct:"Com a hipertensão portal, o sangue busca vias alternativas — a comunicação entre veia gástrica esquerda (portal) e veias esofágicas (sistêmicas, ázigos) forma as varizes.",
      wrongs:["Atrofia muscular não forma varizes venosas.","Extravasamento para peritônio gera ascite, não varizes.","A hipoalbuminemia contribui para ascite e edema, mas não é causa direta das varizes.","Correta.","A esplenomegalia coexiste mas não comprime o esôfago."]}},

  {id:25, aula:"a3", topic:"cir-insuficiencia", dif:"medio", stem:"Paciente cirrótico apresenta-se no pronto-socorro com confusão mental e flapping (asterixis). A esposa informa que há três dias não evacua. A hipótese mais provável para o quadro é",
    alts:["Síndrome de abstinência alcoólica.","Encefalopatia hepática precipitada por constipação intestinal.","Acidente vascular encefálico isquêmico de instalação recente.","Intoxicação alcoólica aguda isolada.","Hipoglicemia sintomática."],
    correct:1,
    exp:{correct:"A amônia produzida pela ação bacteriana sobre proteínas no intestino se acumula com a constipação; no cirrótico sem função hepática, a amônia atravessa a barreira hematoencefálica, sendo convertida em glutamina pelos astrócitos e causando edema e disfunção cerebral. Por isso se prescreve lactulose para manter 2 ou mais evacuações ao dia.",
      wrongs:["Abstinência alcoólica cursa com tremor, sudorese e agitação, sem flapping característico.","Correta.","AVC isquêmico cursa com déficit focal, não com flapping bilateral característico de encefalopatia hepática.","Intoxicação alcoólica aguda não explica especificamente o asterixis.","Hipoglicemia é diferencial, mas o padrão com flapping é mais clássico de encefalopatia hepática e a história de constipação corrobora."]}},

  {id:26, aula:"a3", topic:"cir-insuficiencia", dif:"medio", stem:"Sobre o quadro laboratorial da insuficiência hepática crônica, assinale a afirmação correta.",
    alts:["Transaminases em valores normais excluem qualquer hepatopatia.","A creatinina está tipicamente reduzida por hepatopatia.","A hipoalbuminemia é achado precoce e rápido.","O alargamento do tempo de protrombina (INR) é mais sensível a alterações agudas da função hepática do que a albumina.","A bilirrubina direta cai em casos de colestase."],
    correct:3,
    exp:{correct:"TP/INR alarga-se rápido na falência aguda porque os fatores de coagulação vitamina K-dependentes têm meia-vida curta. A albumina tem meia-vida ~20 dias, reflete crônico.",
      wrongs:["Transaminases normais não excluem hepatopatia — no cirrótico com fibrose estabelecida, os valores podem estar normais ou levemente alterados.","A creatinina não é alterada diretamente pela hepatopatia; na síndrome hepatorrenal ela sobe por vasoconstrição renal.","Hipoalbuminemia é marcador crônico, não agudo; a albumina cai lentamente.","Correta.","Em colestase, a bilirrubina direta (conjugada) sobe, não cai."]}},

  {id:27, aula:"a3", topic:"transaminases", dif:"medio", stem:"Sobre as transaminases AST e ALT, é correto afirmar que",
    alts:["AST e ALT se elevam apenas em hepatopatias.","ALT tem alta concentração intracelular nos hepatócitos e é mais específica de fígado que a AST.","ALT é mais elevada que AST em lesões musculares agudas.","As duas enzimas têm idêntica localização, concentração e especificidade orgânica.","AST é mais específica de fígado que ALT."],
    correct:1,
    exp:{correct:"A ALT tem concentração predominantemente intracelular em hepatócitos, sendo a transaminase mais específica de fígado. AST existe também em músculo cardíaco, esquelético, rins e cérebro.",
      wrongs:["AST pode se elevar em infarto agudo do miocárdio, rabdomiólise, AVC — não apenas em hepatopatias.","Correta.","Em lesões musculares, é a AST que se eleva de forma mais marcante, não a ALT.","As enzimas diferem em localização e especificidade: ALT predomina em fígado; AST tem distribuição mais ampla.","É o contrário — ALT é mais específica de fígado que AST."]}},

  {id:28, aula:"a3", topic:"cir-hipertensao-portal", dif:"medio", stem:"A peritonite bacteriana espontânea (PBE) em paciente com ascite cirrótica ocorre por",
    alts:["Translocação bacteriana a partir do intestino, em meio a hipertensão portal e imunidade comprometida.","Contaminação iatrogênica exclusivamente durante paracentese terapêutica.","Disseminação a partir de endocardite bacteriana aguda.","Ruptura de víscera oca com derramamento de conteúdo intestinal.","Hematogênese bacteriana originada de foco pulmonar."],
    correct:0,
    exp:{correct:"A PBE decorre da translocação bacteriana pela parede intestinal, favorecida pela hipertensão portal e pela imunidade reduzida do cirrótico, com infecção secundária do líquido ascítico.",
      wrongs:["Correta.","Paracentese é procedimento seguro com baixa taxa de contaminação iatrogênica; PBE é predominantemente endógena.","Endocardite é causa rara de PBE; a via é primordialmente intestinal.","PBE é, por definição, espontânea — sem perfuração visceral (que caracterizaria peritonite secundária).","Foco pulmonar pode causar bacteremia mas não é a via principal da PBE."]}},

  {id:29, aula:"a3", topic:"hep-etiologia", dif:"medio", stem:"Sobre a hepatite medicamentosa aguda, é correto afirmar que",
    alts:["Apresenta o menor risco de fulminação entre as hepatites agudas.","Entre as hepatites agudas, apresenta maior risco de evolução para insuficiência hepática.","Nunca ocorre com fitoterápicos, como a valeriana.","É sempre reversível com a suspensão do medicamento, independentemente do tempo de exposição.","Corresponde à maior parte dos casos de hepatite crônica."], correct:1,
    exp:{correct:"Entre as hepatites agudas, a medicamentosa apresenta o maior risco de evolução para insuficiência hepática — especialmente em fármacos de alto potencial hepatotóxico, doses elevadas ou sensibilidade individual.",
      wrongs:["Pelo contrário, apresenta o maior risco, não o menor.","Correta.","Fitoterápicos como a valeriana estão na lista de hepatotóxicos — a ideia de 'natural = seguro' é incorreta.","A reversibilidade depende do grau de necrose instalada; em casos graves pode progredir mesmo após retirada.","A hepatite medicamentosa é forma predominantemente aguda, não crônica."]}},

  {id:30, aula:"a3", topic:"cir-insuficiencia", dif:"dificil", stem:"Sobre a síndrome hepatorrenal na cirrose hepática avançada, é correto afirmar que",
    alts:["Não se relaciona à hipoalbuminemia e à redução da pressão oncótica.","Cursa com aumento do fluxo sanguíneo renal e elevação da taxa de filtração glomerular.","É prontamente revertida pelo uso isolado de diurético tiazídico.","Decorre de lesão estrutural irreversível do parênquima renal desde o início.","É causada por vasodilatação esplâncnica com queda do volume circulante efetivo e vasoconstrição renal compensatória."],
    correct:4,
    exp:{correct:"Na cirrose, a vasodilatação esplâncnica reduz o volume circulante efetivo; o organismo ativa SRAA e simpático, gerando vasoconstrição renal, retenção de sódio e água e queda da filtração. Não há, inicialmente, lesão estrutural — trata-se de insuficiência renal funcional.",
      wrongs:["A hipoalbuminemia contribui ao reduzir a pressão oncótica, agravando o quadro volêmico.","O fluxo sanguíneo renal cai e a TFG diminui na síndrome hepatorrenal.","Tiazídico isolado não reverte o quadro; o manejo envolve volume e vasoconstritores esplâncnicos específicos.","Não há lesão estrutural inicial; trata-se de insuficiência funcional por alterações hemodinâmicas.","Correta."]}},

  {id:31, aula:"a3", topic:"cir-insuficiencia", dif:"dificil", stem:"Na encefalopatia hepática, o mecanismo central pelo qual a amônia contribui para a disfunção cerebral envolve",
    alts:["Ativação direta de receptores NMDA nos oligodendrócitos.","Formação de placas amiloides a partir da amônia oxidada.","Apoptose direta de neurônios por ação citotóxica da amônia no citoplasma neuronal.","Acumulação de amônia nos astrócitos, onde é convertida em glutamina, aumentando a osmolaridade intracelular e gerando edema astrocitário.","Precipitação da amônia nas sinapses, bloqueando canais de cloro."],
    correct:3,
    exp:{correct:"No SNC, astrócitos captam a amônia e a convertem em glutamina, aumentando a osmolaridade intracelular, causando edema celular e disfunção neuronal com alterações de neurotransmissão.",
      wrongs:["Não é o mecanismo descrito.","Não é o mecanismo descrito; placas amiloides são da doença de Alzheimer, não da encefalopatia hepática.","O mecanismo descrito não é de apoptose direta neuronal primária, e sim alteração astrocitária osmótica.","Correta.","Não é o mecanismo descrito — a alteração é astrocitária e osmótica."]}},

  {id:32, aula:"a3", topic:"cir-etiologia", dif:"dificil", stem:"Na esquistossomose hepatoesplênica, a ascite pode ser pronunciada apesar da função hepatocelular preservada. A razão para isso é",
    alts:["A esquistossomose causa cirrose clássica com falência precoce dos hepatócitos.","Há fibrose periportal (fibrose de Symmers) com hipertensão portal intensa, mas a síntese de albumina fica relativamente preservada.","A hipoalbuminemia grave é achado inicial e dominante.","A ascite ocorre por infecção bacteriana direta do líquido peritoneal.","A doença causa obstrução prévia da veia cava inferior."], correct:1,
    exp:{correct:"A esquistossomose gera fibrose periportal (Symmers), aumentando a resistência portal e gerando ascite por mecanismo hemodinâmico. A arquitetura lobular e a síntese de albumina ficam relativamente preservadas — a ascite é hemodinâmica, não hipoalbuminêmica.",
      wrongs:["A esquistossomose tipicamente não causa cirrose clássica no início; seu mecanismo é diferente.","Correta.","A hipoalbuminemia grave não é a característica inicial dominante da esquistossomose.","A ascite é hemodinâmica, não primariamente infecciosa.","Não há obstrução de cava na esquistossomose; a fibrose é periportal."]}},

  // ============ AULA 4 — HEPATITE A (8 questões) ============
  {id:33, aula:"a4", topic:"hepA-transmissao", dif:"facil", stem:"A principal via de transmissão da hepatite A é",
    alts:["Vertical, com soroconversão no último trimestre.","Aerossol, em ambientes mal ventilados.","Parenteral, por compartilhamento de seringas.","Sexual, especialmente em relações desprotegidas.","Fecal-oral, por ingestão de água ou alimentos contaminados."],
    correct:4,
    exp:{correct:"A hepatite A é transmitida por via fecal-oral, via ingestão de água ou alimentos contaminados, frequentemente por manipulação inadequada das mãos. O homem é o único hospedeiro natural do vírus.",
      wrongs:["Transmissão vertical não é característica de hepatite A.","Aerossol não é via de transmissão da hepatite A.","Parenteral é mecanismo clássico de hepatite B e C, não A.","Sexual pode ter relevância em práticas oro-anais, mas não é a via principal.","Correta."]}},

  {id:34, aula:"a4", topic:"hepA-virus", dif:"facil", stem:"O vírus da hepatite A pertence à família",
    alts:["Hepadnaviridae.","Picornaviridae.","Retroviridae.","Herpesviridae.","Flaviviridae."],
    correct:1,
    exp:{correct:"O VHA é um vírus RNA da família Picornaviridae, sem envelope, com cerca de 27 nm.",
      wrongs:["Hepadnaviridae é a família do vírus da hepatite B.","Correta.","Retroviridae é a família de retrovírus como o HIV — não corresponde ao VHA.","Herpesviridae engloba HSV, CMV, EBV — não o VHA.","Flaviviridae é a família do vírus da hepatite C."]}},

  {id:35, aula:"a4", topic:"hepA-clinica", dif:"medio", stem:"Sobre a evolução da hepatite A, é correto afirmar que",
    alts:["Cronifica em 75% dos casos, exigindo tratamento antiviral prolongado.","O diagnóstico requer PCR para HAV-RNA em todos os casos.","A doença responde bem a antivirais diretos como o sofosbuvir.","Todos os pacientes apresentam icterícia clássica.","Até 70% das crianças menores de 10 anos são assintomáticas; em adultos, a doença costuma ser mais sintomática e o risco de fulminância após os 40 anos é de cerca de 2%."],
    correct:4,
    exp:{correct:"Em crianças menores de 10 anos, até 70% são assintomáticas; nos adultos, a doença costuma ser mais sintomática; o risco de falência hepática fulminante é de 0,3% na infância e 2% em adultos após os 40 anos. A doença não cronifica.",
      wrongs:["A hepatite A não cronifica; essa afirmação se aplica à hepatite C.","PCR não é exigência diagnóstica de rotina; o padrão é sorologia (IgM anti-VHA).","Não há antivirais específicos aprovados para hepatite A; o tratamento é de suporte.","A maioria dos pacientes — e especialmente crianças — é assintomática ou oligossintomática.","Correta."]}},

  {id:36, aula:"a4", topic:"hepA-diag", dif:"medio", stem:"Criança de 6 anos, frequentadora de creche com surto recente de diarreia e icterícia, apresenta transaminases acima de 10× o valor de referência e colúria. O exame laboratorial mais apropriado para confirmar hepatite A aguda é",
    alts:["Pesquisa de IgM anti-VHA por ELISA.","HCV-RNA por PCR quantitativo.","HBsAg quantitativo.","Dosagem de alfa-fetoproteína sérica.","Pesquisa de IgG anti-VHA isoladamente."],
    correct:0,
    exp:{correct:"O diagnóstico específico da hepatite A aguda é feito por ELISA IgM anti-VHA, detectável a partir do 5º dia de sintomas e marcador de infecção recente.",
      wrongs:["Correta.","HCV-RNA é exame para hepatite C, não A.","HBsAg é exame para hepatite B, não A.","Alfa-fetoproteína é marcador de hepatocarcinoma, sem utilidade diagnóstica em hepatite A aguda.","IgG isolado indica apenas contato prévio ou vacinação, não infecção aguda."]}},

  {id:37, aula:"a4", topic:"hepA-prevencao", dif:"medio", stem:"Sobre a prevenção da hepatite A no Brasil, é correto afirmar que",
    alts:["Não existe vacina licenciada.","A vacinação não está incluída no calendário do SUS.","A vacina confere imunidade definitiva e está incluída no calendário do SUS aos 15 meses de idade, para crianças maiores de 1 ano.","A vacinação é realizada apenas em profissionais de saúde.","A vacina deve ser repetida anualmente, como a da influenza."], correct:2,
    exp:{correct:"A vacina da hepatite A confere imunidade definitiva; no Brasil, é aplicada pelo SUS aos 15 meses de idade, para crianças maiores de 1 ano. Higiene, saneamento e água tratada compõem a prevenção.",
      wrongs:["A vacina é licenciada e disponível.","Ela está, sim, no calendário vacinal do SUS.","Correta.","A vacinação não se restringe a profissionais de saúde.","A vacina não requer reforço anual; o esquema previsto é único (com esquemas diferentes em adultos)."]}},

  {id:38, aula:"a4", topic:"hepA-tratamento", dif:"medio", stem:"O tratamento da hepatite A aguda baseia-se em",
    alts:["Transplante hepático em todos os casos.","Antibioticoterapia empírica de amplo espectro.","Antivirais de ação direta contra o VHA.","Interferon peguilado associado à ribavirina.","Medidas de suporte, hidratação e controle de sintomas."],
    correct:4,
    exp:{correct:"Não há tratamento antiviral específico para hepatite A; o manejo é de suporte, com controle de sintomas, hidratação e observação clínica.",
      wrongs:["Transplante é reservado apenas aos casos raros de falência hepática fulminante.","Hepatite A é causada por vírus; antibiótico não tem papel no tratamento do agente.","Não há antivirais específicos aprovados para hepatite A.","Peg-IFN + ribavirina era parte do esquema antigo para hepatite C, não hepatite A.","Correta."]}},

  {id:39, aula:"a4", topic:"hepA-epidemiologia", dif:"dificil", stem:"Sobre a epidemiologia da hepatite A no Brasil, é correto afirmar que",
    alts:["A região Norte apresenta a maior incidência, enquanto o Sudeste apresenta a menor, refletindo diferenças de saneamento básico.","A doença é menos frequente em áreas com bom saneamento.","A maior parte dos casos no Brasil ocorre em adultos acima de 60 anos.","Menos de 10% da população brasileira teve contato prévio com o VHA.","A incidência é homogênea em todas as regiões do país."],
    correct:0,
    exp:{correct:"No Brasil, a região Norte apresenta a maior incidência (11,37–36,19/100 000 hab), enquanto o Sudeste tem a menor (0,88–5/100 000 hab). A distribuição reflete diferenças de saneamento básico; cerca de 75% dos adultos brasileiros já tiveram contato prévio com o VHA.",
      wrongs:["Correta.","É o contrário: a doença é mais comum em áreas com déficit de saneamento. Essa alternativa inverte a associação.","Cerca de 57% dos casos ocorrem em menores de 10 anos; idosos não predominam.","No Brasil, cerca de 75% dos adultos já tiveram contato com o vírus, não menos de 10%.","A distribuição é heterogênea entre regiões do Brasil."]}},

  {id:40, aula:"a4", topic:"hepA-transmissao", dif:"dificil", stem:"Uma manipuladora de alimentos em um restaurante em bairro urbano apresentou-se com icterícia, colúria e fadiga, sendo confirmada hepatite A aguda (IgM anti-VHA reagente). Ela relata início dos sintomas há 7 dias. O período de maior transmissibilidade e a conduta de saúde pública mais apropriada são, respectivamente,",
    alts:["Apenas durante a fulminação hepática; afastamento indicado só se houver febre.","Somente enquanto IgG estiver negativo; afastamento por 60 dias.","Durante a icterícia, apenas; continuação normal do trabalho.","Começa ~10 dias após a infecção e dura cerca de 20 dias, podendo preceder os sintomas; afastar a profissional do manuseio de alimentos.","Somente após a soroconversão IgG; afastamento desnecessário."],
    correct:3,
    exp:{correct:"A eliminação do vírus começa ~10 dias após a infecção e dura cerca de 20 dias, podendo preceder o aparecimento dos sintomas. Por isso, o afastamento do manuseio de alimentos é fundamental no controle do surto.",
      wrongs:["Transmissibilidade existe em todos os casos, não só fulminantes.","IgG positivo não define fim do período de transmissibilidade; o critério é epidemiológico.","A transmissibilidade excede o período de icterícia — precede o início dos sintomas inclusive.","Correta.","A soroconversão IgG não é o marcador da transmissibilidade; a eliminação fecal é o que importa."]}},

  // ============ AULA 5 — LEISHMANIOSE (12 questões) ============
  {id:41, aula:"a5", topic:"leish-geral", dif:"facil", stem:"Sobre as características gerais da leishmaniose, é correto afirmar que",
    alts:["É uma doença contagiosa, transmitida diretamente de pessoa a pessoa.","É uma doença infecciosa, não contagiosa, zoonótica, transmitida por vetor.","É transmitida apenas em ambiente urbano, sem vínculo com vetores silvestres.","Tem apenas a forma cutânea, sem acometimento visceral.","A infecção natural confere imunidade protetora definitiva."], correct:1,
    exp:{correct:"A leishmaniose é infecciosa e não contagiosa; é zoonose (acomete outros animais e secundariamente o homem), transmitida pela picada de flebotomíneos.",
      wrongs:["Não há transmissão direta pessoa-pessoa.","Correta.","Ocorre tanto em ambiente silvestre quanto urbano, com reservatórios distintos.","Apresenta forma cutânea (LTA) e visceral (LV).","A infecção e a doença não conferem imunidade protetora; há risco de reinfecção."]}},

  {id:42, aula:"a5", topic:"leish-vetor", dif:"facil", stem:"O vetor da leishmaniose é",
    alts:["Um mosquito Anopheles, com hábito diurno.","Um flebotomíneo (Lutzomyia spp.), popularmente conhecido como mosquito-palha, com hábito vespertino/noturno.","O Triatoma infestans (barbeiro), por contato com fezes no local da picada.","Um carrapato Rhipicephalus, por fixação prolongada.","A Simulium (borrachudo), após picada indolor."], correct:1,
    exp:{correct:"O vetor é o flebotomíneo, mais conhecido como mosquito-palha, birigui ou asa-branca; no Brasil, a forma visceral é transmitida por Lutzomyia longipalpis. Hábito vespertino/noturno.",
      wrongs:["Anopheles é vetor da malária, não da leishmaniose.","Correta.","Triatoma (barbeiro) é vetor da doença de Chagas.","Carrapato não transmite leishmaniose.","Borrachudo não é vetor da leishmaniose."]}},

  {id:43, aula:"a5", topic:"leish-parasita", dif:"medio", stem:"As duas formas evolutivas principais de Leishmania e seus ambientes são, respectivamente,",
    alts:["Promastigota, no tubo digestivo do inseto vetor; amastigota, intracelular nos macrófagos do hospedeiro mamífero.","Taquizoíto, no sangue; bradizoíto, no músculo.","Merozoíto, nas hemácias; hipnozoíto, no fígado.","Microfilária, no sangue; adulto, no sistema linfático.","Trofozoíto, no intestino humano; cisto, no vetor."],
    correct:0,
    exp:{correct:"Leishmania é parasita intracelular obrigatório de macrófagos do sistema fagocítico mononuclear. Tem duas formas: promastigota (flagelada, no vetor) e amastigota (aflagelada, no hospedeiro, dentro de macrófagos).",
      wrongs:["Correta.","Taquizoíto/bradizoíto são formas de Toxoplasma gondii, não Leishmania.","Merozoíto/hipnozoíto são formas de Plasmodium (malária).","Microfilária/adulto referem-se às filárias, não a Leishmania.","Trofozoíto/cisto pertencem a protozoários do intestino (Entamoeba, Giardia), não Leishmania."]}},

  {id:44, aula:"a5", topic:"leish-reservatorio", dif:"medio", stem:"No Brasil, o principal reservatório urbano da leishmaniose visceral é",
    alts:["O cão (Canis familiaris).","A raposa.","O marsupial.","O homem.","O gato doméstico."],
    correct:0,
    exp:{correct:"Em área urbana, o cão é o principal reservatório da leishmaniose visceral, com prevalência maior entre cães que entre humanos. Em ambiente silvestre, os reservatórios incluem raposas e marsupiais.",
      wrongs:["Correta.","A raposa é reservatório silvestre, não urbano.","O marsupial é reservatório silvestre, não urbano.","O homem é hospedeiro acidental, não reservatório primário.","O gato não é o principal reservatório urbano."]}},

  {id:45, aula:"a5", topic:"leish-lta-lesao", dif:"medio", stem:"A lesão cutânea clássica da leishmaniose tegumentar americana caracteriza-se como",
    alts:["Nódulo pigmentado, indolor e de crescimento exofítico rápido.","Vesículas agrupadas em base eritematosa, com crostas melicéricas.","Petéquias puntiformes generalizadas em extremidades.","Placa eritematoescamosa, com escamas prateadas, sem ulceração.","Úlcera arredondada, com bordas elevadas e infiltradas (em moldura), com o parasito concentrado nas bordas."],
    correct:4,
    exp:{correct:"A lesão clássica é uma úlcera arredondada, com bordas elevadas e infiltradas (em moldura). O parasito concentra-se nas bordas — por isso a biópsia deve ser feita na borda, não no centro necrótico.",
      wrongs:["Nódulo pigmentado exofítico não corresponde à LTA clássica.","Vesículas agrupadas com crostas melicéricas sugerem impetigo ou herpes, não LTA.","Petéquias generalizadas não são a forma típica de LTA.","Esse padrão (placa eritematoescamosa com escamas prateadas) sugere psoríase, não LTA.","Correta."]}},

  {id:46, aula:"a5", topic:"leish-imunidade", dif:"medio", stem:"Sobre a resposta imune na leishmaniose, é correto afirmar que",
    alts:["A resposta imune não influencia o desfecho clínico da doença.","A resposta humoral (Th2) é eficaz em eliminar o parasita em todas as formas.","Na forma tegumentar clássica, predomina resposta celular (Th1), útil para conter o parasita.","A leishmaniose visceral é eliminada por anticorpos protetores produzidos durante a infecção.","A IgE específica é o marcador imunológico mais associado a cura nas formas graves."],
    correct:2,
    exp:{correct:"Na LTA, predomina resposta celular Th1 (IFN-γ, IL-12, TNF), que ativa macrófagos e contém o parasita em granulomas. Na LV, há desvio para Th2, com anticorpos detectáveis mas sem eliminação eficaz do parasita.",
      wrongs:["A resposta imune influencia diretamente o desfecho: Th1 dominante tende a controlar; Th2 dominante permite progressão.","A resposta humoral Th2 é detectável na LV, mas não é eficaz em eliminar o parasita.","Correta.","Os anticorpos da LV são detectáveis mas não protetores; não curam a infecção.","IgE não é o marcador imunológico central da cura de leishmaniose."]}},

  {id:47, aula:"a5", topic:"leish-lv-clinica", dif:"medio", stem:"Homem de 40 anos, procedente de Araçatuba (SP), apresenta febre há 3 meses, perda de 8 kg, palidez importante e esplenomegalia que ultrapassa a linha umbilical. Hemograma revela pancitopenia. A hipótese diagnóstica mais provável é",
    alts:["Hepatite A aguda anictérica.","Malária por Plasmodium vivax.","Linfoma de Hodgkin clássico.","Leishmaniose cutânea localizada.","Leishmaniose visceral (calazar)."],
    correct:4,
    exp:{correct:"Febre prolongada + hepatoesplenomegalia + pancitopenia + procedência de área endêmica (Araçatuba é foco urbano de LV no Brasil) = pensar em leishmaniose visceral (calazar).",
      wrongs:["Hepatite A aguda é quadro curto, com icterícia e transaminases elevadas; não explica pancitopenia e esplenomegalia gigante.","Malária também entra como diferencial, mas a esplenomegalia gigante e a pancitopenia com evolução de meses em área de transmissão de LV é mais sugestiva de leishmaniose visceral.","Linfoma é diferencial e pode causar quadro similar, mas a procedência é a pista epidemiológica principal para LV.","Leishmaniose cutânea é tegumentar e cursa com lesões de pele, não com hepatoesplenomegalia.","Correta."]}},

  {id:48, aula:"a5", topic:"leish-diag", dif:"medio", stem:"O método de escolha para diagnóstico parasitológico da leishmaniose visceral é",
    alts:["Hemocultura em meio específico para Leishmania.","Intradermorreação de Montenegro (IRM), atualmente de rotina.","Dosagem sérica de alfa-fetoproteína.","Raspado das bordas de úlceras cutâneas.","Aspirado de medula óssea para pesquisa de amastigotas."],
    correct:4,
    exp:{correct:"O diagnóstico parasitológico da LV é feito pelo aspirado de medula óssea (ou de baço), com pesquisa de amastigotas dentro de macrófagos. A sorologia (ELISA, imunofluorescência) também é útil pela ativação humoral na LV.",
      wrongs:["Hemocultura não é rotina diagnóstica da leishmaniose.","A IRM não é mais utilizada como exame de rotina no Brasil.","Alfa-fetoproteína é marcador de hepatocarcinoma, sem relação com leishmaniose.","Raspado de borda de úlcera é método para LTA, não LV.","Correta."]}},

  {id:49, aula:"a5", topic:"leish-tratamento", dif:"medio", stem:"Os medicamentos considerados de primeira escolha para tratamento da leishmaniose, no Brasil, são",
    alts:["Benzonidazol e nifurtimox.","Antimoniais pentavalentes (ex.: antimoniato de meglumina) e, em casos específicos, anfotericina B.","Mebendazol e albendazol.","Sulfadiazina e pirimetamina.","Cloroquina e primaquina."], correct:1,
    exp:{correct:"No Brasil, o tratamento depende da forma: para LTA, antimoniais pentavalentes (antimoniato de meglumina / Glucantime) continuam como 1ª linha. Para LV, o PCDT-MS atual recomenda anfotericina B lipossomal como 1ª escolha na maioria dos pacientes (&lt;1 a ou ≥50 a, gestantes, comorbidades, HIV, falha prévia); antimonial é alternativa restrita a adultos jovens sem risco.",
      wrongs:["Benzonidazol e nifurtimox são usados em doença de Chagas.","Correta.","Mebendazol/albendazol são anti-helmínticos.","Sulfadiazina + pirimetamina são indicados em toxoplasmose.","Cloroquina + primaquina tratam malária."]}},

  {id:50, aula:"a5", topic:"leish-lta-mucocutanea", dif:"medio", stem:"A forma mucocutânea da leishmaniose tegumentar caracteriza-se por",
    alts:["Aparecimento simultâneo com a lesão cutânea inicial.","Localização preferencial em pele de tronco e extremidades, poupando face.","Lesões destrutivas em mucosas (nariz, faringe, laringe), frequentemente secundárias e tardias em relação à lesão cutânea inicial.","Involução espontânea em dias a semanas, sem necessidade de tratamento.","Evolução benigna, com resposta rápida à terapêutica tradicional."], correct:2,
    exp:{correct:"As lesões mucocutâneas geralmente surgem meses ou anos após a resolução da lesão cutânea inicial, acometendo cavidades nasais, faringe, laringe e cavidade oral, com caráter destrutivo.",
      wrongs:["Em geral são secundárias, surgindo meses ou anos após a lesão cutânea inicial, não simultaneamente.","A forma mucocutânea acomete mucosas (nariz, faringe, laringe, cavidade oral) — não a pele de tronco e extremidades. A forma cutânea tampouco poupa face; acomete áreas expostas.","Correta.","Não involuem espontaneamente; são lesões graves e progressivas que exigem tratamento.","A forma mucocutânea responde mal à terapia tradicional e exige tratamento prolongado, frequentemente com anfotericina B."]}},

  {id:51, aula:"a5", topic:"leish-controle", dif:"dificil", stem:"Sobre as medidas de controle da leishmaniose visceral no Brasil, é correto afirmar que",
    alts:["Não há papel da educação em saúde nas ações de controle.","Não há indicação de borrifação de inseticidas nas áreas de casos humanos.","A eliminação indiscriminada de todos os cães domésticos da área é conduta vigente.","As estratégias atuais incluem luta antivetorial periódica, manejo dos reservatórios (eutanásia apenas dos cães doentes), tratamento dos casos humanos e educação em saúde.","A vacinação humana em larga escala é a principal estratégia de controle."],
    correct:3,
    exp:{correct:"As ações de controle compreendem luta antivetorial (borrifação em casas com casos humanos ou caninos a cada 6 meses, por mínimo 2 anos), manejo de reservatórios (revisão do sacrifício: atualmente se preconiza eutanásia apenas dos animais doentes), tratamento humano (reduz letalidade e, secundariamente, fontes) e educação em saúde.",
      wrongs:["A educação em saúde é parte das quatro estratégias de controle.","Ha indicação sim de borrifação em casas com casos autóctones.","A política evoluiu: não mais eliminação indiscriminada, e sim eutanásia dos animais doentes.","Correta.","Não há vacina humana de rotina para LV no Brasil."]}},

  {id:52, aula:"a5", topic:"leish-imunidade", dif:"dificil", stem:"Das espécies a seguir, a que induz resposta celular mais intensa, com maior destruição tecidual e menor quantidade de parasitos na lesão, é",
    alts:["Leishmania major europeia.","Leishmania (L.) amazonensis.","Leishmania (V.) braziliensis.","Leishmania chagasi (= infantum).","Leishmania guyanensis."],
    correct:2,
    exp:{correct:"L. (V.) braziliensis induz resposta celular (Th1) mais intensa e mais rápida; por isso há maior destruição tecidual e poucos parasitos visualizáveis nas lesões.",
      wrongs:["Não há 'L. major europeia' como entidade causadora do padrão clínico perguntado; a resposta correta é L. braziliensis.","L. amazonensis induz resposta celular menos intensa e mais lenta, com mais parasitos na lesão.","Correta.","L. chagasi / infantum é a causadora da leishmaniose visceral, com quadro diferente (humoral Th2 predominante, não destruição tecidual cutânea).","L. guyanensis ocorre no norte da bacia amazônica; seu padrão não é o de maior destruição tecidual entre as espécies."]}},

  // ============ AULA 6 — HEPATITE C (10 questões) ============
  {id:53, aula:"a6", topic:"hepC-virus", dif:"facil", stem:"O vírus da hepatite C é um vírus",
    alts:["DNA, família Herpesviridae, com latência em gânglios sensoriais.","RNA, família Retroviridae, com transcrição reversa.","DNA, família Hepadnaviridae, com integração ao genoma do hospedeiro.","RNA, família Flaviviridae, com replicação citoplasmática sem integração ao genoma do hospedeiro.","RNA, família Picornaviridae, sem envelope."],
    correct:3,
    exp:{correct:"O VHC é um vírus RNA da família Flaviviridae. Toda a replicação ocorre no citoplasma, sem integração do material genético ao DNA do hospedeiro — fundamento molecular da cura esterilizante.",
      wrongs:["Herpesviridae não engloba o VHC.","Retroviridae (HIV) faz transcrição reversa — VHC não.","Hepadnaviridae é do VHB, com integração ao DNA hospedeiro; o VHC é diferente.","Correta.","Picornaviridae é a família do vírus da hepatite A."]}},

  {id:54, aula:"a6", topic:"hepC-transmissao", dif:"facil", stem:"A via de transmissão mais importante do vírus da hepatite C, no contexto epidemiológico atual, é",
    alts:["Compartilhamento de agulhas e seringas no uso de drogas injetáveis, além de materiais médico/odontológico e estéticos com biossegurança inadequada.","Transmissão aérea em ambientes de alta densidade.","Transmissão por vetor hematófago, em áreas tropicais.","Transmissão vertical, responsável pela maioria absoluta dos casos.","Transmissão oro-fecal, via alimentos contaminados."],
    correct:0,
    exp:{correct:"Uso de drogas injetáveis com compartilhamento e materiais sem esterilização adequada (saúde, manicure, tatuagem) são as principais vias atuais. Sexual e vertical existem mas são minoritárias.",
      wrongs:["Correta.","O VHC não é transmitido por via aérea.","Não há vetor artrópode conhecido para VHC.","Vertical é incomum — menos de 5% da transmissão no Brasil.","Oro-fecal é hepatite A, não C."]}},

  {id:55, aula:"a6", topic:"hepC-aguda", dif:"medio", stem:"Sobre a hepatite C aguda, é correto afirmar que",
    alts:["A evolução para fulminante é frequente e ocorre em mais de 30% dos casos.","Há clareamento espontâneo em menos de 5% dos casos agudos.","A soroconversão do anti-HCV ocorre em até 24 horas após a exposição.","Cursa com icterícia clássica em 80% dos casos.","Pode ser sintomática em até 20% dos casos, com sintomas inespecíficos; a icterícia ocorre em menos de 10%."],
    correct:4,
    exp:{correct:"Cerca de 80% dos casos agudos são assintomáticos; quando sintomáticos, os sinais são inespecíficos (astenia, febre baixa, náuseas). Icterícia ocorre em menos de 10%. Fulminante é rara. Clareamento espontâneo ocorre em 25–50%.",
      wrongs:["Fulminante é rara, não frequente.","Clareamento espontâneo ocorre em 25–50% dos casos, muito acima de 5%.","A soroconversão leva em média 6–8 semanas; 24 horas não é compatível.","Pelo contrário, icterícia é rara.","Correta."]}},

  {id:56, aula:"a6", topic:"hepC-cronica", dif:"medio", stem:"A progressão natural da hepatite C não tratada, ao longo de décadas, envolve aproximadamente",
    alts:["Cronificação em 5% dos casos e ausência de evolução para cirrose em qualquer contexto.","Cura espontânea da forma crônica em 80% dos casos sem intervenção.","Cronificação em 75% dos casos e cura espontânea tardia em 50% dos cirróticos estabelecidos.","Resolução em 100% dos casos após 10 anos, sem tratamento.","Cronificação em 75% dos casos; cirrose em 20% dos crônicos; hepatocarcinoma em 2–5% dos crônicos."],
    correct:4,
    exp:{correct:"Na história natural sem tratamento: cronificação ~75%; 20% dos crônicos evoluem para cirrose; 2–5% dos crônicos evoluem para hepatocarcinoma.",
      wrongs:["Taxa de cronificação é alta (~75%), e a cirrose ocorre em 20% dos crônicos.","Cura espontânea da forma crônica é muito rara.","Não há cura espontânea tardia significativa em cirróticos sem tratamento.","A maioria dos casos cronifica; resolução universal é incorreta.","Correta."]}},

  {id:57, aula:"a6", topic:"hepC-diag", dif:"medio", stem:"Paciente doador de sangue assintomático apresenta anti-HCV reagente na triagem. O próximo passo diagnóstico mais adequado é",
    alts:["Iniciar imediatamente tratamento com sofosbuvir + velpatasvir.","Repetir o anti-HCV após 6 meses, sem outros exames.","Solicitar HCV-RNA por PCR para confirmar infecção ativa.","Solicitar HBsAg e HBeAg quantitativos para refinar o diagnóstico.","Encaminhar para biópsia hepática imediata, antes de qualquer outro exame."], correct:2,
    exp:{correct:"Anti-HCV reagente indica apenas contato prévio. A confirmação de infecção ativa é feita por HCV-RNA por PCR. Genotipagem já não é rotina porque o tratamento é pangenotípico.",

  {id:58, aula:"a6", topic:"hepC-diag", dif:"medio", stem:"Em um paciente com hepatite C previamente tratado e com resposta virológica sustentada (cura), a sorologia (anti-HCV) costuma permanecer",
    alts:["Positiva apenas em coinfecção com HIV.","Negativa, imediatamente após o término do tratamento.","Positiva, por período prolongado, mesmo após a cura; não serve, portanto, para controle do tratamento.","Positiva somente enquanto persistir o HCV-RNA detectável.","Negativa após 6 meses, marcando a cura definitiva."],
    correct:2,
    exp:{correct:"O anti-HCV costuma permanecer positivo por longo período mesmo após a cura. Por isso, o controle pós-tratamento é feito por HCV-RNA (PCR), não por sorologia.",
      wrongs:["A persistência do anti-HCV após cura não depende de coinfecção com HIV.","A sorologia não negativa imediatamente — pode permanecer positiva por anos.","Correta.","A positividade da sorologia não depende do HCV-RNA estar detectável.","A sorologia não necessariamente negativa em 6 meses."]}},

  {id:59, aula:"a6", topic:"hepC-ciclo", dif:"medio", stem:"A explicação molecular para a cura esterilizante da hepatite C, diferentemente do que ocorre no HIV ou na hepatite B, é",
    alts:["A formação de reservatórios latentes em neurônios sensoriais.","A produção de anticorpos neutralizantes de longa duração pelo hospedeiro.","A replicação intramitocondrial exclusiva.","A alta taxa de integração do material genético viral no núcleo do hepatócito.","O ciclo viral ocorrer integralmente no citoplasma, sem integração do RNA viral ao genoma do hospedeiro."],
    correct:4,
    exp:{correct:"O ciclo do VHC ocorre no citoplasma do hepatócito; o RNA viral não é integrado ao genoma do hospedeiro. Por isso, ao eliminar-se o vírus, não há reservatório latente para reativação — cura é esterilizante.",
      wrongs:["Reservatórios em neurônios sensoriais são próprios dos herpesvírus.","Anticorpos neutralizantes de longa duração não se formam adequadamente em VHC — daí a possibilidade de reinfecção.","Não há replicação intramitocondrial do VHC.","VHB integra DNA ao genoma do hospedeiro, o VHC não.","Correta."]}},

  {id:60, aula:"a6", topic:"hepC-tratamento", dif:"medio", stem:"Sobre o tratamento atual da hepatite C com antivirais de ação direta (esquema pangenotípico sofosbuvir + velpatasvir), é correto afirmar que",

    correct:4,
    exp:{correct:"O PCDT atual indica tratamento para todos, independentemente da fibrose. Sofosbuvir + velpatasvir (Epclusa®) tem cura &gt; 97%. Duração: 12 semanas em não cirróticos ou Child A; em Child B/C, 12 semanas com ribavirina (ou 24 semanas sem ribavirina se houver contraindicação a ela). A resposta virológica sustentada é avaliada 12 semanas após o término.",

  {id:61, aula:"a6", topic:"hepC-cronica-riscos", dif:"dificil", stem:"Entre os fatores associados à progressão mais rápida para fibrose hepática em pacientes com hepatite C crônica, destaca-se",

    exp:{correct:"Fatores associados a progressão mais rápida: idade &gt; 40 anos à infecção, sexo masculino, etilismo, coinfecção com VHB e/ou HIV, imunossupressão, esteatose hepática, resistência insulínica.",

  {id:62, aula:"a6", topic:"hepC-aguda-classif", dif:"dificil", stem:"Em uma profissional de saúde que sofreu acidente perfurocortante há 8 semanas, com fonte sabidamente positiva para hepatite C, a definição de hepatite C aguda inclui",
    alts:["Soroconversão recente (anti-HCV negativo na exposição → reagente em 90 dias), ou anti-HCV não reagente com HCV-RNA detectável até 90 dias após a exposição.","Exclusivamente anti-HCV reagente em uma única amostra, sem necessidade de soroconversão documentada.","Apenas a presença de icterícia clínica, independente de exame laboratorial.","Presença de HBsAg reagente em paciente expostada.","Alterações de função hepática após mais de 6 meses de acompanhamento sintomático."], correct:0,
    exp:{correct:"Os critérios envolvem: soroconversão recente documentada (anti-HCV negativo no momento da exposição e reagente em novo exame com intervalo de 90 dias), ou anti-HCV não reagente com HCV-RNA detectável por até 90 dias após a exposição/sintomas.",

  {id:63, aula:"a3", topic:"cir-bilirrubina", dif:"dificil", stem:"Um paciente com insuficiência hepática crônica apresenta bilirrubina total 6 mg/dL, com predomínio de bilirrubina direta. A interpretação fisiopatológica mais correta é",
    alts:["Lesão hepatocelular com vazamento da bilirrubina já conjugada e/ou colestase, levando a predomínio da fração direta.","Deficiência isolada da conjugação hepática, com elevação exclusiva da indireta.","Insuficiência renal com retenção da bilirrubina não conjugada.","Síndrome de Gilbert como causa mais provável do padrão.","Hemólise intravascular com aumento isolado da bilirrubina indireta."],

  {id:64, aula:"a2", topic:"foi-etiologia", dif:"dificil", stem:"Mulher de 70 anos, internada há 8 semanas por FOI clássica, está sendo investigada. Hemoculturas negativas, HIV negativo, painel reumatológico sem alterações. TC de tórax e abdome sem foco. Qual das seguintes hipóteses deve ser considerada, dada a frequência etiológica em idosos?",
    alts:["Febre factícia como causa mais provável, descartando qualquer outra hipótese.","Síndrome de Munchausen associada a uso crônico de antitérmico.","Exclusivamente doença de Kawasaki.","Neoplasias e doenças hematológicas, como linfomas, que respondem por parcela importante das causas em idosos, especialmente em investigações infecciosas inconclusivas.","Apenas infecções virais autolimitadas do trato respiratório."],

      wrongs:["Febre factícia é causa rara; deve ser considerada, mas não como única hipótese.","Munchausen é causa rara e requer aspectos psiquiátricos compatíveis.","Kawasaki é doença tipicamente pediátrica.","Correta.","Viroses autolimitadas não se enquadram — FOI exige mais de 3 semanas sem diagnóstico."]}},

  {id:65, aula:"a1", topic:"epi-definicoes", dif:"dificil", stem:"Diferenciar epidemia de endemia em uma região requer considerar",
    alts:["O limiar epidêmico local (acima do qual é epidemia) e o padrão de ocorrência constante (endemia), considerando espaço e tempo.","A gravidade clínica dos casos, independentemente do número.","A origem geográfica do agente etiológico.","O perfil etário dos afetados, sem considerar incidência.","Apenas o número absoluto de casos."],
    correct:0,
    exp:{correct:"Endemia tem ocorrência constante ao longo do tempo (temporalmente ilimitada, com variações sazonais); epidemia tem elevação inesperada acima do limiar epidêmico preestabelecido para aquela circunstância e doença.",

  {id:66, aula:"a5", topic:"leish-lta-ciclo", dif:"dificil", stem:"Sobre o tropismo de Leishmania nas infecções em humanos, é correto afirmar que",
    alts:["É intracelular obrigatório, sobretudo em macrófagos e outras células do sistema fagocitário mononuclear, como células de Kupffer hepáticas e células reticulares esplênicas.","Infecta preferencialmente linfócitos T CD4+.","Tem tropismo exclusivo por hepatócitos.","Localiza-se em neurônios do SNC, causando encefalopatia direta primária.","O parasita é extracelular obrigatório, circulando livremente no plasma."],

  {id:67, aula:"a6", topic:"hepC-vigilancia", dif:"dificil", stem:"Sobre o acompanhamento de paciente com hepatite C crônica que atinge resposta virológica sustentada (cura), é correto afirmar que",
    alts:["A cura remove completamente o risco de hepatocarcinoma em todos os casos.","Em paciente que já tinha cirrose instalada, a erradicação viral não remove o risco de hepatocarcinoma ou de descompensação clínica — o seguimento deve ser mantido.","Após a cura, pode ser feita imunização que impede qualquer reinfecção.","A cura é sempre acompanhada de negativação completa da sorologia em 6 meses.","Após a cura, o paciente torna-se fonte protetora para outros, com imunidade transmissível."], correct:1,
