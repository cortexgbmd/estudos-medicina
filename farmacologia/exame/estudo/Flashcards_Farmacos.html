<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards de Fármacos — Mecanismo & RAM</title>
<style>
:root{--bg:#0f1419;--bg2:#161b22;--bg3:#1c2330;--txt:#e6edf3;--txt2:#9aa7b4;--acc:#4ea1ff;--acc2:#7ee787;--warn:#ffb454;--dang:#ff7b72;--border:#2a313c;}
[data-theme="light"]{--bg:#f7f9fc;--bg2:#fff;--bg3:#eef2f7;--txt:#1a2330;--txt2:#55636f;--acc:#1666c7;--acc2:#1a7f37;--warn:#9a6700;--dang:#cf222e;--border:#d6dee7;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center}
#top{width:100%;max-width:760px;padding:14px 16px 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{background:var(--bg3);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--acc)}
.topline{display:flex;align-items:center;justify-content:center;gap:8px}
.eyebtn{background:none;border:none;padding:2px 4px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--txt2);opacity:.5;transition:opacity .15s}
.eyebtn:hover{opacity:.95;border:none}
.eyelbl{font-size:11px;letter-spacing:.02em}
.eyebtn .eye-closed{display:none}
.eyebtn.closed .eye-open{display:none}
.eyebtn.closed .eye-closed{display:inline-block}
#count{margin-left:auto;color:var(--txt2);font-size:13px}
#saveNote{flex-basis:100%;color:var(--txt2);font-size:12px;margin-top:2px}
#wrap{width:100%;max-width:760px;padding:6px 16px 16px;flex:1;display:flex;flex-direction:column}
#card{perspective:1600px;height:60vh;min-height:340px;margin:8px 0;cursor:pointer}
#inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
#card.flip #inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:18px;background:var(--bg2);padding:26px 28px;display:flex;flex-direction:column;overflow-y:auto}
.back{transform:rotateY(180deg)}
.area{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--txt2)}
.classe{font-size:15px;color:var(--acc);margin-top:4px}
.farm{font-size:32px;font-weight:700;color:var(--acc2);margin:auto 0;line-height:1.2}
.hint{text-align:center;color:var(--txt2);font-size:13px;margin-top:auto}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin:14px 0 2px}
.lbl:first-of-type{margin-top:4px}
.val{font-size:17px;line-height:1.45}
.val.ram b,.dang{color:var(--dang)}
.backhead{font-size:20px;font-weight:700;color:var(--acc2);border-bottom:1px solid var(--border);padding-bottom:8px}
#nav{display:flex;gap:8px;align-items:center}
#nav button{flex:0 0 auto}
#bMark{margin-left:auto}
#bMark.on{background:var(--warn);color:#1a2330;border-color:var(--warn)}
.marked .backhead::after,.marked .farm::after{content:" ★";color:var(--warn);font-size:16px}
kbd{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:12px}
#done{text-align:center;padding:40px;color:var(--txt2);font-size:17px}
#done button{margin-top:8px}
#rate{display:none;gap:8px;justify-content:center}
#rate.show{display:flex}
#rate button{flex:1;max-width:160px;padding:11px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px}
#rate small{font-size:11px;font-weight:400;color:var(--txt2)}
.r-again{border-color:var(--dang)!important;color:var(--dang)}
.r-hard{border-color:var(--warn)!important;color:var(--warn)}
.r-good{border-color:var(--acc)!important;color:var(--acc)}
.r-easy{border-color:var(--acc2)!important;color:var(--acc2)}
#prompt{text-align:center;color:var(--txt2);font-size:13px;padding:10px}
#prompt.hide{display:none}
.streak{font-size:13px;color:var(--warn);margin-top:8px;min-height:18px}
#filterPanel{display:none;width:100%;max-width:760px;padding:2px 16px 10px}
#filterPanel.open{display:block;max-height:56vh;overflow-y:auto}
.fgroup{margin-top:10px}
.fgroup h4{margin:4px 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:8px}
.fgroup h4 .blktog{font-size:10px;border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--txt2);text-transform:none;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none;line-height:1.2}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0b1320;font-weight:600}
[data-theme="light"] .chip.on{color:#fff}
.factions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px}
.factions .sp{flex:1}
#trainBtn{background:var(--acc2);border-color:var(--acc2);color:#0b1320;font-weight:700}
[data-theme="light"] #trainBtn{color:#fff}
</style>
</head>
<body>
<div id="top">
<button id="filterBtn" onclick="togPanel()">🎯 Temas <span id="selSummary"></span> ▾</button>
<button onclick="restart()">↺ Reiniciar sessão</button>
<button onclick="th()">☀︎/☾</button>
<span id="count"></span>
<span id="saveNote">✓ Progresso salvo automaticamente neste navegador — pode fechar e voltar depois (até offline). Dá pra marcar vários temas e treinar só os que você tem mais dificuldade.</span>
</div>
<div id="filterPanel"></div>
<div id="wrap">
<div id="card" onclick="flip()">
<div id="inner">
<div class="face front">
<div class="topline"><span class="area" id="fArea"></span><button id="eyeBtn" class="eyebtn" onclick="event.stopPropagation();togArea()"><svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4 5 10 5 10-5 10-5"/><line x1="5" y1="15" x2="4" y2="17"/><line x1="12" y1="17" x2="12" y2="19"/><line x1="19" y1="15" x2="20" y2="17"/></svg><span class="eyelbl">esconder tema</span></button></div>
<div class="farm" id="fFarm"></div>
<div class="hint">recordar: <b>classe · mecanismo · RAM</b></div>
</div>
<div class="face back" id="backFace">
<div class="backhead" id="bFarm"></div>
<div class="lbl" id="bClasseLbl">Classe</div><div class="val" id="bClasse"></div>
<div class="lbl">Mecanismo de ação</div><div class="val" id="bMec"></div>
<div class="lbl">Reação adversa (RAM)</div><div class="val ram" id="bRam"></div>
<div class="streak" id="streak"></div>
</div>
</div>
</div>
<div id="rate">
<button class="r-again" onclick="rate(0)">Errei<small>1 · volta logo</small></button>
<button class="r-hard" onclick="rate(1)">Difícil<small>2 · em breve</small></button>
<button class="r-good" onclick="rate(2)">Bom<small>3 · mais tarde</small></button>
<button class="r-easy" onclick="rate(3)">Fácil<small>4 · 2× = sai</small></button>
</div>
<div id="prompt">Clique no card ou <kbd>espaço</kbd> para ver a resposta</div>
<div id="done" style="display:none"></div>
</div>
<script>

 al:["Anest. locais","Soraia"],ag:["Anest. gerais","Soraia"],bnm:["BNM","Soraia"],aine:["AINEs/Analgésicos","Soraia"],opi:["Opioides","Soraia"],

{a:"dm",c:"Sulfonilureia",f:"Glibenclamida, gliclazida, glimepirida",m:"Fecha canal K⁺ATP na célula β → ↑ secreção de insulina",r:"<b>Hipoglicemia</b>, ganho de peso",p:"Secretagogo"},

{a:"lip",c:"Fibrato",f:"Fenofibrato, ciprofibrato, genfibrozila",m:"Agonista PPAR-α → ↑ lipase lipoproteica",r:"Miopatia (↑ com estatina), litíase biliar",p:"↓ TG (hipertrigliceridemia isolada)"},

{a:"coag",c:"Heparina (parenteral)",f:"HNF, enoxaparina (HBPM)",m:"Ativa antitrombina → inibe IIa e Xa (HBPM = mais Xa)",r:"<b>Sangramento, HIT</b>",p:"TTPa (HNF); antídoto protamina"},
{a:"coag",c:"DOAC (oral)",f:"Rivaroxabana, apixabana, dabigatrana",m:"Inibe Xa (riva/api) ou trombina/IIa (dabi)",r:"Sangramento",p:"Sem monitoração de rotina"},
{a:"coag",c:"Antiagregante",f:"AAS, clopidogrel, ticagrelor",m:"AAS → inibe COX-1/TXA2; clopidogrel → bloqueia P2Y12 (ADP)",r:"Sangramento",p:"AAS = irreversível"},

{a:"classe",c:"éster (procaína) · amida (lidocaína, bupivacaína)",f:"Anestésicos locais",m:"bloqueiam canais de Na⁺ → impedem a condução do impulso",r:"toxicidade SNC→CV; bupivacaína a mais cardiotóxica; não pega em pus (pH ácido)",p:""},
{a:"classe",c:"sevoflurano, halotano, isoflurano",f:"Anestésicos gerais inalatórios",m:"deprimem o SNC (↑GABA/↓excitação); velocidade depende da solubilidade no sangue",r:"halotano: hepatotoxicidade e arritmia",p:""},
{a:"classe",c:"propofol, etomidato, cetamina, tiopental",f:"Anestésicos gerais EV",m:"potencializam GABA-A (cetamina = antagonista NMDA)",r:"propofol: hipotensão; cetamina: ↑PA/alucinação; etomidato: supressão adrenal",p:""},

{a:"classe",c:"não-seletivos (AAS, ibuprofeno, diclofenaco); coxibes (celecoxibe); paracetamol, dipirona",f:"AINEs / analgésicos",m:"inibem a COX → ↓ prostaglandinas",r:"não-seletivo: úlcera; coxibe: risco CV; paracetamol: hepatotox",p:""},
{a:"classe",c:"fortes (morfina, fentanil, metadona); fracos (codeína, tramadol); antagonista (naloxona)",f:"Opioides",m:"agonistas μ/κ/δ (Gi → ↓AMPc → fecham Ca²⁺)",r:"depressão respiratória, constipação, miose, dependência",p:""},
{a:"classe",c:"Na⁺ (fenitoína, carbamazepina, lamotrigina); GABA (valproato, fenobarbital); Ca²⁺-T (etossuximida)",f:"Anticonvulsivantes",m:"bloqueiam Na⁺/Ca²⁺ ou ↑ GABA",r:"fenitoína: gengiva; carbamazepina: hiponatremia; valproato: hepatotox; lamotrigina: rash",p:""},
{a:"classe",c:"ISRS (fluoxetina); tricíclico (amitriptilina); IRSN (venlafaxina); IMAO (fenelzina); lítio",f:"Antidepressivos / humor",m:"↑ monoaminas (5-HT/NA) na fenda",r:"ISRS: disfunção sexual; tricíclico: anticolinérgico/cardiotox; IMAO: crise c/ tiramina",p:""},
{a:"classe",c:"típicos (haloperidol, clorpromazina); atípicos (risperidona, olanzapina, clozapina)",f:"Antipsicóticos",m:"bloqueio D2 (atípicos: D2 + 5-HT2A)",r:"típicos: extrapiramidal; atípicos: síndrome metabólica; clozapina: agranulocitose",p:""},
{a:"classe",c:"diazepam, midazolam, lorazepam, clonazepam, alprazolam",f:"Benzodiazepínicos",m:"↑ frequência de abertura do Cl⁻ no GABA-A",r:"sedação, dependência, depressão resp. (c/ álcool); antídoto flumazenil",p:""},
{a:"classe",c:"levodopa+carbidopa, pramipexol, selegilina, entacapona, biperideno, amantadina",f:"Antiparkinsonianos",m:"repõem ou preservam a dopamina",r:"discinesias, náusea, hipotensão",p:""},
{a:"classe",c:"pilocarpina, neostigmina (mim.); atropina, ipratrópio (líticos)",f:"SNA — colinérgicos/anticolinérgicos",m:"agonista/↑ACh (mim.) ou antagonista muscarínico (lítico)",r:"mim.: SLUDGE; lítico: anticolinérgico (seco, quente, midríase)",p:""},
{a:"classe",c:"captopril, enalapril, ramipril",f:"IECA",m:"inibem a ECA → ↓ angiotensina II e ↓ degradação de bradicinina",r:"tosse, angioedema, hipercalemia, teratogênico",p:""},
{a:"classe",c:"losartan, valsartan, candesartan",f:"BRA (ARA II)",m:"bloqueiam o receptor AT1 da angiotensina II",r:"hipercalemia, teratogênico (sem tosse)",p:""},
{a:"classe",c:"di-hidro (anlodipino, nifedipino); não-di-hidro (verapamil, diltiazem)",f:"Antagonistas de cálcio (BCC)",m:"bloqueiam canal de Ca²⁺ → vasodilatação ou ↓FC/contratilidade",r:"edema de MMII; verapamil: bradicardia/constipação",p:""},
{a:"classe",c:"propranolol, atenolol, metoprolol, carvedilol",f:"Betabloqueadores",m:"bloqueiam β1 → ↓FC, ↓contratilidade, ↓renina",r:"bradicardia, broncoespasmo, mascara hipoglicemia",p:""},
{a:"classe",c:"acetazolamida (proximal), furosemida (alça), HCTZ (distal), espironolactona (coletor)",f:"Diuréticos",m:"↓ reabsorção de Na⁺ em sítios do néfron",r:"hipocalemia (alça/tiazídico), hipercalemia (poupador), acidose (acetazolamida)",p:""},
{a:"classe",c:"digoxina",f:"Digitálicos",m:"inibe Na⁺/K⁺-ATPase → ↑Ca²⁺ intracel → ↑ contratilidade",r:"intoxicação: arritmia, náusea, xantopsia",p:""},
{a:"classe",c:"I (lidocaína, quinidina); II (β-bloq); III (amiodarona); IV (verapamil)",f:"Antiarrítmicos (Vaughan-Williams)",m:"bloqueiam Na⁺ / K⁺ / Ca²⁺ ou β",r:"amiodarona: tireoide, pulmão, fígado, ↑QT",p:""},
{a:"classe",c:"adrenalina, noradrenalina, dopamina, dobutamina",f:"Vasoativos (catecolaminas)",m:"agonistas adrenérgicos (α/β, dose-dependente)",r:"taquicardia, arritmia, isquemia",p:""},
{a:"classe",c:"metformina, sulfonilureia, iSGLT2, iDPP-4, GLP-1, glitazona, acarbose",f:"Hipoglicemiantes orais",m:"↓ glicemia por mecanismos distintos (↓gliconeogênese, ↑insulina, glicosúria…)",r:"sulfonilureia: hipoglicemia; metformina: acidose láctica; glitazona: edema",p:""},
{a:"classe",c:"ultrarrápida (lispro), regular, NPH, lenta (glargina)",f:"Insulinas",m:"repõem insulina (curvas de início/duração diferentes)",r:"hipoglicemia, ganho de peso, lipodistrofia",p:""},
{a:"classe",c:"estatina, fibrato, ezetimiba, niacina, colestiramina",f:"Hipolipemiantes",m:"estatina: inibe HMG-CoA (↓LDL); fibrato: PPAR-α (↓TG)",r:"miopatia/rabdomiólise (estatina e fibrato)",p:""},
{a:"classe",c:"varfarina, heparina, DOAC; AAS, clopidogrel; fibrinolíticos (alteplase)",f:"Anticoagulantes / antiagregantes",m:"reduzem a coagulação em pontos diferentes da cascata",r:"sangramento",p:""},
{a:"inter",c:"Interação (a mais cobrada)",f:"Digoxina + Furosemida / tiazídico",m:"diurético → hipocalemia → K⁺ e digoxina competem na Na⁺/K⁺-ATPase",r:"<b>Intoxicação digitálica</b> (arritmia, xantopsia) · repor K⁺/Mg²⁺",p:""},
{a:"inter",c:"Interação",f:"Tiazídico + Hipoglicemiante",m:"hipocalemia → ↓ secreção de insulina",r:"<b>Hiperglicemia</b> (antagoniza o hipoglicemiante) · preferir IECA/BRA",p:""},
{a:"inter",c:"Interação",f:"BZD + álcool / depressor do SNC",m:"depressão do SNC somada",r:"<b>Depressão respiratória</b> · antídoto flumazenil",p:""},
{a:"inter",c:"Interação",f:"IMAO + tricíclico / ISRS",m:"excesso de serotonina na fenda",r:"<b>Síndrome serotoninérgica</b> · não associar (washout)",p:""},
{a:"inter",c:"Interação (alimento)",f:"IMAO + Tiramina (queijo/vinho)",m:"tiramina acumula → libera noradrenalina",r:"<b>Crise hipertensiva</b> ('reação do queijo')",p:""},
{a:"inter",c:"Interação",f:"Fibrato + Estatina",m:"toxicidade muscular somada",r:"<b>Rabdomiólise</b> · checar CK; evitar a dupla",p:""},
{a:"inter",c:"Interação",f:"Fibrato + Varfarina",m:"desloca a varfarina da albumina",r:"<b>Sangramento</b> · monitorar INR",p:""},
{a:"inter",c:"Interação",f:"AINE + Varfarina",m:"desloca da albumina + antiagrega + gastrolesão",r:"<b>Sangramento</b> · evitar",p:""},
{a:"inter",c:"Interação",f:"Fenitoína + outros antiepilépticos",m:"fenitoína = indutor enzimático (valproato = inibidor)",r:"níveis séricos alterados · monitorar",p:""},
{a:"inter",c:"Interação",f:"Lítio + Diurético / AINE",m:"↓ excreção renal do lítio",r:"<b>Intoxicação por lítio</b> · dosar litemia",p:""}
];
CARDS.forEach((c,i)=>c.id=i);
const WORKING=20;                 // tamanho do conjunto de trabalho
const OFFSET=[2,4,9,15];          // Errei, Difícil, Bom, Fácil -> em quantos cards reaparece
let baseDeck=[], pool=[], q=[], st={}, total=0, mastered=0, shown=false, hideArea=false;
let selected=new Set(Object.keys(META));
const SAVEKEY='farmaco-flashcards-v1';
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify({sel:[...selected],q:q.map(c=>c.id),pool:pool.map(c=>c.id),st:st,total:total,mastered:mastered,hideArea:hideArea}));}catch(e){}}
function restoreSession(){
 let d;try{d=JSON.parse(localStorage.getItem(SAVEKEY)||'null');}catch(e){return false;}
 if(!d||!Array.isArray(d.q))return false;
 q=d.q.map(id=>CARDS[id]).filter(Boolean);
 pool=(d.pool||[]).map(id=>CARDS[id]).filter(Boolean);
 if(q.length===0&&pool.length===0)return false;
 st=d.st||{}; total=d.total||0; mastered=d.mastered||0; hideArea=!!d.hideArea;
 if(Array.isArray(d.sel)) selected=new Set(d.sel.filter(k=>META[k]));
 if(!selected.size) selected=new Set(Object.keys(META));
 refreshChips();
 shown=false; render(); return true;
}

const BLOCKS=[["Soraia","Bloco Soraia · SNC"],["Adilson","Bloco Adilson · Cardio/Endócrino"],["Ambos","Interações"],["Geral","Resumos"]];
function buildPanel(){
 const p=document.getElementById('filterPanel');let h='';
 for(const [blk,label] of BLOCKS){
  const keys=Object.keys(META).filter(k=>META[k][1]===blk); if(!keys.length)continue;
  h+='<div class="fgroup"><h4 onclick="togBlock(\''+blk+'\')">'+label+' <span class="blktog">marcar/desmarcar tudo</span></h4><div class="chips">';
  for(const k of keys){const n=CARDS.filter(c=>c.a===k).length;h+='<button class="chip" data-k="'+k+'" onclick="togChip(\''+k+'\')">'+META[k][0]+' <span style="opacity:.55">'+n+'</span></button>';}
  h+='</div></div>';
 }
 h+='<div class="factions"><button onclick="selAll()">Todas</button><button onclick="selNone()">Limpar</button><span class="sp"></span><button id="trainBtn" onclick="train()">Treinar <span id="trainN"></span></button></div>';
 p.innerHTML=h; refreshChips();
}
function refreshChips(){
 document.querySelectorAll('#filterPanel .chip').forEach(b=>b.classList.toggle('on',selected.has(b.dataset.k)));
 const n=CARDS.filter(c=>selected.has(c.a)).length, tot=Object.keys(META).length;
 const tn=document.getElementById('trainN'); if(tn)tn.textContent='('+n+' cards)';
 const ss=document.getElementById('selSummary'); if(ss)ss.textContent= selected.size===0?'(nenhum)':selected.size===tot?'(todos)':'('+selected.size+' temas)';
}
function togChip(k){ selected.has(k)?selected.delete(k):selected.add(k); refreshChips(); }
function togBlock(blk){ const keys=Object.keys(META).filter(k=>META[k][1]===blk); const allOn=keys.every(k=>selected.has(k)); keys.forEach(k=>allOn?selected.delete(k):selected.add(k)); refreshChips(); }
function selAll(){ selected=new Set(Object.keys(META)); refreshChips(); }
function selNone(){ selected=new Set(); refreshChips(); }
function togPanel(){ document.getElementById('filterPanel').classList.toggle('open'); }
function train(){ if(!selected.size){alert('Escolha pelo menos um tema.');return;} document.getElementById('filterPanel').classList.remove('open'); startSession(); }
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(){
 const keys = selected.size ? selected : new Set(Object.keys(META));
 baseDeck = CARDS.filter(c=>keys.has(c.a));
 if(!baseDeck.length) baseDeck=CARDS.slice();
 baseDeck=shuffleArr(baseDeck.slice());          // aleatório
 st={}; baseDeck.forEach(c=>st[c.id]=0);
 total=baseDeck.length; mastered=0; pool=baseDeck.slice(); q=[];
 while(q.length<WORKING && pool.length) q.push(pool.shift());
 shown=false; render(); save();
}
function applyFilter(){startSession();}
function restart(){startSession();}
function render(){
 const card=document.getElementById('card'), done=document.getElementById('done');
 const rate=document.getElementById('rate'), prompt=document.getElementById('prompt');
 if(q.length===0){
   card.style.display='none';rate.classList.remove('show');prompt.classList.add('hide');
   done.style.display='block';
   done.innerHTML=total?('✅ Sessão concluída — '+mastered+' de '+total+' cards dominados (2× Fácil seguidos).<br><button onclick="restart()">↺ Recomeçar</button>'):'Sem cards.';
   document.getElementById('count').textContent='';
   return;
 }
 card.style.display='block';done.style.display='none';
 const c=q[0];
 document.getElementById('fArea').textContent=META[c.a][0]+' · '+META[c.a][1];
 document.getElementById('fArea').style.visibility=hideArea?'hidden':'visible';
 var _eb=document.getElementById('eyeBtn'); if(_eb){_eb.classList.toggle('closed',hideArea);_eb.querySelector('.eyelbl').textContent=hideArea?'mostrar tema':'esconder tema';}
 document.getElementById('fFarm').textContent=c.f;
 document.getElementById('bFarm').textContent=c.f;
 document.getElementById('bClasse').innerHTML=c.c;
 document.getElementById('bClasseLbl').textContent=c.a==='classe'?'Exemplos':(c.a==='inter'?'Tipo':'Classe');
 document.getElementById('bMec').innerHTML=c.m;
 document.getElementById('bRam').innerHTML=c.r;
 const s=st[c.id]||0;
 document.getElementById('streak').textContent=s>0?'Sequência Fácil: '+s+'/2 — mais 1 "Fácil" e ele sai de rotação':'';
 card.classList.toggle('flip',shown);
 rate.classList.toggle('show',shown);
 prompt.classList.toggle('hide',shown);
 document.getElementById('count').textContent='Dominados '+mastered+'/'+total+'  ·  Em rotação '+q.length+'  ·  Aguardando '+pool.length;
}
function flip(){ if(!shown){shown=true;render();} }
function rate(level){
 if(!shown) return;
 const c=q.shift();
 if(level===3){ st[c.id]=(st[c.id]||0)+1; } else { st[c.id]=0; }   // Fácil acumula; resto zera
 if(level===3 && st[c.id]>=2){                                     // 2x Fácil seguidos -> suspende
   mastered++;
   if(pool.length) q.push(pool.shift());                           // puxa novo p/ manter ~20
 } else {
   q.splice(Math.min(OFFSET[level], q.length), 0, c);              // reinsere conforme botão
 }
 shown=false; render(); save();
}
function th(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='light'?'':'light');}
function togArea(){hideArea=!hideArea; save(); render();}
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON')return;
 if(e.code==='Space'){e.preventDefault(); if(!shown){shown=true;render();} return;}
 if(shown && ['1','2','3','4'].includes(e.key)) rate(parseInt(e.key)-1);
});
buildPanel(); if(!restoreSession()) startSession();
</script>
