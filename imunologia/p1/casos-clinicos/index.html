    "question": "Um jovem de 19 anos é levado ao pronto-socorro por apresentar febre alta (39,8°C), cefaleia intensa, rigidez de nuca e vômitos há cerca de 12 horas. Os familiares relatam que ele começou a ficar confuso e mais sonolento nas últimas horas. Na admissão, o médico suspeita de meningite e realiza uma punção lombar. A análise inicial do líquor revela:<br><br><div class='lab'>• Líquor turvo<br>• Aumento importante de neutrófilos<br>• Proteína elevada<br>• Glicose diminuída<br>• Presença de diplococos Gram-negativos na coloração de Gram</div>Diante do achado, a equipe inicia antibioticoterapia imediata. Considerando os mecanismos de reconhecimento do sistema imunológico, qual componente da imunidade INATA é o primeiro a reconhecer o patógeno e iniciar a resposta inflamatória neste caso?",

let cur=0,ans={},rev={};
const $=s=>document.getElementById(s);
function render(){
  const q=Q[cur];
  let h=`<div class="qinfo"><span class="qnum">Caso ${q.number} de ${Q.length}</span><span class="diff">${q.difficulty||'Difícil'}</span></div>`;
  h+=`<div class="qtxt">${q.question}</div>`;
  q.options.forEach((o,i)=>{
    let cls="opt";
    if(rev[cur]){
      if(i===q.correct) cls+=" correct";
      else if(ans[cur]===i) cls+=" wrong";
    } else if(ans[cur]===i) cls+=" sel";
    h+=`<button class="${cls}" onclick="pick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;
  });
  h+=`<div class="btns"><button onclick="reveal()">Revelar Resposta</button></div>`;
  h+=`<div class="expl ${rev[cur]?'show':''}" id="expl"><strong>Gabarito: ${String.fromCharCode(65+q.correct)}</strong><br>${q.explanation}</div>`;
  $("qcard").innerHTML=h;
  let g="";
  Q.forEach((qq,i)=>{
    let c="";
    if(i===cur) c+=" cur";
    if(ans[i]!==undefined) c+=" done";
    if(rev[i]&&ans[i]===Q[i].correct) c+=" right";
    else if(rev[i]&&ans[i]!==undefined) c+=" wrong";
    g+=`<button class="${c}" onclick="cur=${i};render()">${i+1}</button>`;
  });
  $("grid").innerHTML=g;
  $("pf").style.width=(Object.keys(rev).length/Q.length*100)+"%";
}
function pick(i){ if(!rev[cur]){ ans[cur]=i; render(); } }
function reveal(){ if(ans[cur]!==undefined){ rev[cur]=true; render(); } }
function go(d){ cur=Math.max(0,Math.min(Q.length-1,cur+d)); render(); }
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
  if(e.key===" ") reveal();
});
render();
</script>
