      wrongs:["O risco de CHC não é totalmente removido, especialmente em cirróticos.","Correta.","Não existe imunidade protetora após a cura — há possibilidade de reinfecção.","A sorologia pode permanecer positiva por anos; não é critério de cura.","A cura não gera imunidade transmissível a outras pessoas."]}},

  {id:68, aula:"a5", topic:"leish-lv-orgaos", dif:"dificil", stem:"Na leishmaniose visceral, as alterações patológicas mais típicas do baço incluem",

    exp:{correct:"Na LV, o baço é profundamente acometido: grande aumento de volume, cápsula tensa por congestão, reativação do SRE com macrófagos e plasmócitos densamente parasitados por amastigotas.",
      wrongs:["A característica marcante é aumento volumoso, não tamanho normal.","Correta.","Nódulos satélites neoplásicos não são o achado típico da LV.","Não há substituição fibrosa completa; há hipertrofia do SRE.","Alterações histológicas são pronunciadas na LV."]}},

  {id:69, aula:"a2", topic:"foi-exames", dif:"dificil", stem:"Homem de 55 anos com FOI clássica, sem foco aparente, apresenta sopro cardíaco novo em ausculta e petéquias em extremidades. Dentre as condutas diagnósticas abaixo, a mais apropriada, além das hemoculturas, é",

  {id:70, aula:"a4", topic:"hepA-fisiopat", dif:"dificil", stem:"Sobre a fisiopatogenia da hepatite A, é correto afirmar que",
    alts:["Há integração do RNA viral ao genoma do hospedeiro, com possível reativação.","O vírus atinge diretamente o hepatócito pela corrente sanguínea sem passar pelo intestino.","O vírus, após ingestão, infecta enterócitos, dissemina-se por via hematogênica e alcança o fígado com tropismo para hepatócitos; os vírions são secretados via biliar e eliminados nas fezes.","A transmissão ocorre por vetores artrópodes, com picada em áreas tropicais.","O vírus cronifica no fígado em cerca de 75% dos casos."],

  {id:71, aula:"a3", topic:"hep-etiologia", dif:"medio", stem:"Uma paciente em uso regular de paracetamol em dose elevada para enxaqueca apresenta, após 5 dias, icterícia, transaminases acima de 10× o valor de referência e alargamento do INR. A hipótese mais provável é",

  {id:72, aula:"a1", topic:"epi-mortalidade", dif:"medio", stem:"Dois países são comparados pelos indicadores de saúde: país X tem mortalidade infantil de 8/1000, enquanto país Y tem 42/1000. A interpretação epidemiológica mais adequada é",

      "2. Trata-se de golpe de calor (hipertermia exercício-associada em onda de calor, pele seca mostrando falência de sudorese, rebaixamento de consciência, instabilidade hemodinâmica). Antitéricos como dipirona/paracetamol agem inibindo a síntese hipotalâmica de PGE2. Como o set point aqui está normal, não há PGE2 elevada para inibir — a temperatura não baixa. Usar antitérmico nesse cenário é inócuo e atrasa a conduta correta.",

  // ============ DISS 3 — AULA 3 ============
  {id:"d4", aula:"a3", title:"Cirrose descompensada com encefalopatia",
    caso:"Homem de 57 anos, etilista crônico, chega ao pronto-socorro trazido pela esposa por 'ficar confuso'. Não evacua há 4 dias. Exame: ictérico +3/4, ascite volumosa, circulação colateral em abdome, asterixis positivo. Hemograma: Hb 9,8; plaquetas 68.000; leucócitos 4.200. Bioquímica: albumina 2,1 g/dL; bilirrubina total 5,8 (direta 4,2); TP/INR 1,9; creatinina 1,5; Na 131.",
    perguntas:[
      "1. Qual é a síndrome clínica em curso e quais achados a sustentam?",
      "2. Liste as quatro grandes consequências fisiopatológicas da insuficiência hepática identificáveis neste paciente e a repercussão clínica de cada.",
      "3. Qual a conduta imediata inicial para o fator precipitante mais provável da descompensação neurológica?",
      "4. Explique por que a esposa dele, no papel de cuidadora, precisa ser orientada a garantir que ele evacue pelo menos duas vezes ao dia em casa."
    ],
    modelo:[
      "1. Cirrose descompensada com encefalopatia hepática (provavelmente grau II) e alterações de hipertensão portal. Achados: história de etilismo + icterícia + ascite + circulação colateral + plaquetopenia (hiperesplenismo) + hipoalbuminemia + alargamento do TP + asterixis + confusão. O conjunto define insuficiência hepática + hipertensão portal descompensadas.",
      "2. (a) Deficiência de detoxificação → acúmulo de amônia → encefalopatia; (b) Deficiência de síntese de albumina → hipoalbuminemia → ascite, edema, derrames; (c) Deficiência de síntese de fatores de coagulação → TP/INR alargado → risco de sangramento; (d) Deficiência de excreção de bilirrubina → icterícia (direta), colúria, acolia fecal.",
      "3. O fator precipitante mais provável é constipação intestinal (4 dias sem evacuar). Conduta imediata: lactulose (via oral ou SNG), titulada para atingir 2 a 3 evacuações pastosas por dia (nem firmes, nem líquidas); reposição eletrolítica; pesquisar e tratar outros precipitantes (PBE por paracentese diagnóstica, sangramento digestivo, uso de sedativos, distúrbios eletrolíticos, infecção, hiponatremia). Excluir sempre PBE em ascítico que descompensa.",
      "4. A encefalopatia hepática é precipitada pelo acúmulo de amônia, produzida pela ação bacteriana sobre proteínas no cólon. Quando o cirrótico fica constipado, a amônia é absorvida em maior quantidade e, pelo shunt portossistêmico, chega à circulação sistêmica sem passar pelo fígado; atravessa a barreira hematoencefálica, é convertida em glutamina pelos astrócitos, causa edema e disfunção cerebral. Garantir 2 evacuações pastosas por dia reduz o tempo de trânsito e o acúmulo de amônia. A lactulose também acidifica o cólon, retendo NH4+ no lúmen. É medida simples, mas decisiva na prevenção de reinternações."
    ]},

  {id:"d5", aula:"a3", title:"Diferenciação etiológica de hepatopatia crônica",
    caso:"Três pacientes na mesma enfermaria, todos com suspeita de hepatopatia crônica: (A) homem de 48 anos, etilista de longa data; (B) mulher de 35 anos, sem etilismo, com ANA e anticorpo anti-músculo liso positivos; (C) homem de 39 anos, procedente do Nordeste brasileiro, com história de contato com água de riachos e esplenomegalia maciça, ascite volumosa e função hepática (albumina, TP, bilirrubina) praticamente normal.",
    perguntas:[
      "1. Qual é a etiologia mais provável para cada paciente? Justifique.",
      "2. Por que o paciente C tem ascite tão volumosa com função hepatocelular preservada? Compare com o mecanismo do paciente A.",
      "3. Qual o princípio terapêutico que muda completamente entre a hepatite alcoólica (A) e a hepatite autoimune (B)?"
    ],
    modelo:[
      "1. (A) Hepatopatia alcoólica crônica — o álcool é a principal causa de hepatopatia crônica. (B) Hepatite autoimune — perfil sorológico com ANA e anti-músculo liso positivos é compatível. (C) Esquistossomose hepatoesplênica — procedência nordestina, contato com água de riacho (cercária de Schistosoma mansoni), esplenomegalia maciça com função hepatocelular preservada é a apresentação clássica.",
      "2. No paciente C (esquistossomose), o parasita gera fibrose periportal (fibrose de Symmers), aumentando a resistência ao fluxo portal e gerando hipertensão portal. A arquitetura lobular e a função hepatocelular ficam relativamente preservadas. A ascite é hemodinâmica, dependente da hipertensão portal — não da queda da albumina. No paciente A (cirrose alcoólica), a ascite resulta da combinação de hipertensão portal + hipoalbuminemia (fígado cirrótico não sintetiza albumina adequadamente), com queda da pressão oncótica somando-se ao mecanismo vascular. Por isso, na esquistossomose, a ascite pode ser volumosa sem edema de MMII tão importante; na cirrose alcoólica, edema e anasarca acompanham a ascite.",
      "3. Na hepatite alcoólica (A), o princípio fundamental é a abstinência — a evolução para insuficiência hepática e cirrose é, na ausência de cirrose estabelecida, reversível com a interrupção do álcool. Na hepatite autoimune (B), o princípio é imunossupressão: corticoides (prednisona) com ou sem azatioprina; sem esse tratamento, a progressão para cirrose é alta. Portanto, um se baseia em evitar o agressor; o outro se baseia em suprimir a resposta imune que é o próprio agressor."
    ]},

  // ============ DISS 5 — AULA 5 ============
  {id:"d7", aula:"a5", title:"Leishmaniose visceral em área emergente",
    caso:"Em um município do interior paulista, emergência para leishmaniose desde 1998. Um paciente de 38 anos, morador da zona urbana, dono de dois cães, procura o ambulatório com febre há 2 meses, perda ponderal de 7 kg, esplenomegalia que ultrapassa a linha umbilical e pancitopenia (Hb 7,9, leucócitos 2.100, plaquetas 58.000).",
    perguntas:[
      "1. Qual é a hipótese diagnóstica mais provável e quais exames devem ser solicitados?",
      "2. Explique, do ponto de vista imunológico, por que a leishmaniose visceral (forma clássica) cursa com sorologia positiva, enquanto a leishmaniose tegumentar clássica tem sorologia habitualmente negativa.",
      "3. Quais medidas de saúde pública devem ser implementadas nesse território, considerando os dois cães do paciente e a epidemiologia urbana da doença?",
      "4. Qual é o tratamento habitual e por que o paciente deve ser acompanhado por tempo prolongado?"
    ],
    modelo:[
      "1. Leishmaniose visceral (calazar). Exames: aspirado de medula óssea (pesquisa direta de amastigotas em macrófagos — padrão-ouro); sorologia (ELISA e imunofluorescência indireta, positivas pela resposta humoral desviada); PCR se disponível; hemograma completo, função hepática, albumina, proteínas totais (hipergamaglobulinemia com hipoalbuminemia clássica); função renal; HIV (pela coinfecção).",
      "2. A leishmaniose visceral cursa com desvio da resposta imune para o padrão Th2 (humoral), com produção de IL-4, IL-10 e outras interleucinas que estimulam a produção de anticorpos — daí a positividade da sorologia. Paradoxalmente, essa resposta humoral não elimina o parasita (intracelular obrigatório em macrófagos), de modo que a positividade sorológica reflete falência da resposta celular protetora. Na LTA clássica, predomina a resposta Th1 (IFN-γ, IL-12, TNF), que ativa macrófagos e contém o parasita em granulomas, mas não gera níveis significativos de anticorpos circulantes — por isso a sorologia é habitualmente pouco útil na LTA clássica.",
      "3. (a) Investigação sorológica e tratamento dos cães da casa (e de vizinhos) — o cão é o principal reservatório urbano da LV; (b) luta antivetorial: borrifação domiciliar com inseticidas em todas as casas com casos humanos ou caninos autóctones, repetida a cada 6 meses por pelo menos 2 anos; (c) educação em saúde: reforçar o manejo ambiental (limpeza de quintais, eliminação de matéria orgânica em decomposição); (d) notificação à vigilância epidemiológica (LV é de notificação compulsória); (e) busca ativa por outros casos humanos na área.",
      "4. Tratamento: antimoniais pentavalentes (antimoniato de meglumina — Glucantime®) em primeira linha; anfotericina B (convencional ou lipossomal) em casos graves, gestantes, falência terapêutica ou quando houver comorbidades. Acompanhamento prolongado porque: (i) a doença pode recidivar, especialmente em imunossuprimidos (HIV+); (ii) a infecção e a doença não conferem imunidade protetora — o paciente pode reinfectar; (iii) é necessário monitorar resposta terapêutica (redução de esplenomegalia, recuperação hematológica, ganho de peso); (iv) complicações cardiotóxicas e pancreáticas dos antimoniais exigem vigilância laboratorial durante o tratamento."
    ]},

  {id:"d8", aula:"a5", title:"Leishmaniose tegumentar — manejo inicial",
    caso:"Homem de 42 anos, caminhoneiro com rota que passa por áreas rurais do Norte do Brasil, chega ao ambulatório com úlcera em perna direita, evoluindo há 8 semanas. Ao exame, lesão de 3 cm de diâmetro, arredondada, bordas elevadas e infiltradas, fundo granuloso, indolor. Sem linfonodomegalia regional importante e sem outras lesões.",
    perguntas:[

      "3. Quais medidas de orientação e cuidado o paciente deve receber?"
    ],
    modelo:[
      "1. Leishmaniose tegumentar americana (LTA), forma cutânea localizada. Lesão clássica em moldura (bordas elevadas e infiltradas) é altamente sugestiva. Exame de escolha: raspado das bordas da lesão com esfregaço e coloração (Giemsa), pesquisa direta de amastigotas; alternativamente, biópsia das bordas com exame histopatológico e/ou PCR. Intradermorreação de Montenegro não é mais utilizada de rotina.",
      "2. Dada a procedência (rotas no Norte/regiões amazônicas) e exposição contínua, as espécies possíveis incluem L. braziliensis e L. amazonensis. Se L. braziliensis estiver envolvida, existe risco tardio de acometimento mucoso (leishmaniose mucocutânea), que surge meses a anos após a resolução da lesão cutânea, acometendo cavidades nasais, faringe, laringe e cavidade oral, com lesões destrutivas. Esse risco justifica o acompanhamento prolongado e a orientação ao paciente sobre sintomas sugestivos (obstrução nasal crônica, epistaxe, disfonia).",

  // ============ DISS 6 — AULA 6 ============
  {id:"d9", aula:"a6", title:"Hepatite C descoberta em doação de sangue",
    caso:"Mulher de 59 anos, doadora regular de sangue, tem anti-HCV reagente em triagem do hemocentro. Nega sintomas. Teve transfusão de hemoderivados em 1988 por acidente automobilístico. Nega uso de drogas injetáveis ou tatuagens. Casada, uma única parceria sexual há 35 anos.",
    perguntas:[
      "1. Qual a provável via de transmissão e por que a sorologia foi descoberta tardiamente?",
      "2. Qual exame deve ser solicitado a seguir? E por que a sorologia anti-HCV, sozinha, não basta para confirmar infecção ativa?",
      "3. Se o HCV-RNA vier positivo, qual a conduta terapêutica, qual a taxa esperada de cura e qual o tempo de tratamento previsto, sabendo que a elastografia evidencia F0 (sem fibrose)?",
      "4. Após a 'cura' virológica, o que a paciente precisa saber sobre: (a) sorologia futura, (b) risco de reinfecção, (c) vigilância de hepatocarcinoma?"
    ],
    modelo:[
      "1. Provável transmissão por transfusão recebida em 1988. Até 1993, não havia testagem sistemática de VHC nos bancos de sangue. A hepatite C cursa com evolução silenciosa — 80% dos casos agudos são assintomáticos, e a fase crônica permanece assintomática por décadas. Por isso, a doença é frequentemente descoberta em triagens de rotina (doação de sangue, check-up) já na fase crônica.",
      "2. HCV-RNA por PCR (teste molecular quantitativo). A sorologia anti-HCV apenas indica contato prévio com o vírus — pode refletir infecção ativa, infecção curada (espontânea ou tratada) ou infecção passada. Em torno de 25–50% dos pacientes que se infectam têm clareamento espontâneo, e suas sorologias permanecem positivas indefinidamente. Apenas o HCV-RNA detectável confirma infecção ativa.",
      "3. Conduta: iniciar tratamento com antiviral de ação direta pangenotípico (sofosbuvir + velpatasvir — Epclusa®). Pacientes não cirróticos (F0–F3) ou Child A (cirrose compensada): 12 semanas de tratamento. Taxa de cura (resposta virológica sustentada) acima de 97%. Genotipagem não é mais necessária para iniciar o tratamento, pois o esquema é pangenotípico.",
      "4. (a) Sorologia: o anti-HCV provavelmente permanecerá positivo por tempo prolongado, mesmo após a cura — não é marcador de cura; o controle pós-tratamento é feito com HCV-RNA por PCR, realizado 12 semanas após o último comprimido (resposta virológica sustentada). (b) Reinfecção: como a cura é esterilizante (sem reservatório latente), não há reativação; mas não há memória imunológica protetora, então reinfecção é possível se houver nova exposição — atenção a práticas de risco. (c) Vigilância de hepatocarcinoma: como a paciente tem F0 (sem fibrose), o risco é muito baixo e a vigilância oncológica sistemática não se justifica nesse caso; em pacientes que alcançam RVS com cirrose já instalada (F4), a vigilância de hepatocarcinoma (ultrassom + AFP a cada 6 meses) deve ser mantida indefinidamente, pois o risco não é zerado pela cura viral."
    ]},

  {id:"d10", aula:"a6", title:"Hepatite C com cirrose — compreender prognóstico",
    caso:"Homem de 64 anos, ex-usuário de drogas injetáveis (parou há 25 anos), diagnóstico recente de hepatite C crônica com HCV-RNA positivo. Elastografia hepática com valor correspondente a F4 (cirrose). Bilirrubina total 1,8; albumina 3,0 g/dL; INR 1,3; plaquetas 98.000; sem ascite, sem encefalopatia, sem varizes sangrantes em endoscopia recente (Child-Pugh A). Pergunta se 'vai ficar curado' ao tomar o tratamento.",
    perguntas:[
      "1. Qual o esquema terapêutico e duração para este paciente? Por que 24 e não 12 semanas?",
      "2. Após o término do tratamento, como será confirmada a cura e quando?",
      "3. Explique ao paciente, de forma didática mas tecnicamente correta, o que significa 'curar a hepatite C' em um paciente que já tem cirrose: o que muda e o que NÃO muda?"
    ],
    modelo:[
      "1. O paciente tem cirrose compensada (Child-Pugh A) — portanto é elegível ao tratamento. Para Child A / não cirrótico, o esquema é sofosbuvir + velpatasvir por 12 semanas, SEM ribavirina. Esquemas com cirrose descompensada (Child B ou C) são diferentes: 12 semanas com ribavirina, ou 24 semanas sem ribavirina se houver contraindicação a ela. Portanto, neste paciente (Child A): 12 semanas apenas com sofosbuvir + velpatasvir.",
      "2. A cura é confirmada pela resposta virológica sustentada (RVS): HCV-RNA indetectável 12 semanas após o último comprimido de tratamento (para esquemas sem interferon) ou 24 semanas (para esquemas com interferon). A espera é necessária porque o PCR detecta material genético, mas não distingue vírus viáveis de restos de vírus em eliminação pelo organismo; esperar 12 semanas assegura que o resultado indetectável reflete eliminação efetiva, não 'lixo biológico' em depuração.",
      "3. O que MUDA: o tratamento elimina o vírus — a partir da RVS, não há mais vírus circulante, não há progressão adicional de dano hepático causada pela infecção, e ele não transmite mais a doença para outras pessoas. O que NÃO muda: ele já tem cirrose instalada. A cirrose é processo irreversível de substituição fibrosa. O risco de hepatocarcinoma (câncer primário de fígado) permanece, mesmo após a cura viral. O risco de descompensação hepática (ascite, encefalopatia, sangramento por varizes, síndrome hepatorrenal) também permanece, ainda que menor do que se continuasse infectado. Portanto, ele precisa manter vigilância indefinida: ultrassom de abdome + alfa-fetoproteína a cada 6 meses; endoscopia periódica conforme avaliação; controle de fatores agravantes (abstinência absoluta de álcool, controle de comorbidades metabólicas, vacinação contra VHA e VHB). 'Cura' aqui é cura da infecção, não cura da cirrose."
    ]}
];

  "leish-geral": {anchor:"#a5", label:"Leishmaniose — geral", subtopics:"zoonose; não contagiosa; sem imunidade protetora"},
  "leish-vetor": {anchor:"#a5", label:"Vetor da leishmaniose", subtopics:"Lutzomyia (mosquito-palha), noturno, só fêmea pica"},
  "leish-parasita": {anchor:"#a5", label:"Parasita Leishmania", subtopics:"promastigota (vetor) / amastigota (macrófago)"},
  "leish-reservatorio": {anchor:"#a5", label:"Reservatórios", subtopics:"cão urbano, raposa/marsupial silvestre"},
  "leish-lta-lesao": {anchor:"#a5", label:"Lesão clássica LTA", subtopics:"úlcera em moldura, parasito na borda"},
  "leish-lta-mucocutanea": {anchor:"#a5", label:"Leishmaniose mucocutânea", subtopics:"secundária, tardia, mucosa nasal/faríngea, destrutiva"},
  "leish-lta-ciclo": {anchor:"#a5", label:"Tropismo intracelular da Leishmania", subtopics:"macrófagos, Kupffer, reticulares do baço"},
  "leish-imunidade": {anchor:"#a5", label:"Imunidade em leishmaniose", subtopics:"LTA = Th1; LV = Th2 (sorologia +, falência celular)"},
  "leish-lv-clinica": {anchor:"#a5", label:"Leishmaniose visceral — clínica", subtopics:"hepatoesplenomegalia + pancitopenia + febre + emagrecimento"},
  "leish-lv-orgaos": {anchor:"#a5", label:"Patologia visceral por órgão", subtopics:"fígado (Kupffer), baço (SRE), medula óssea (pancitopenia)"},
  "leish-diag": {anchor:"#a5", label:"Diagnóstico de leishmaniose", subtopics:"direto: raspado, biópsia, aspirado MO; sorologia em LV"},
  "leish-tratamento": {anchor:"#a5", label:"Tratamento", subtopics:"antimoniais pentavalentes; anfotericina B em graves"},
  "leish-controle": {anchor:"#a5", label:"Controle de leishmaniose", subtopics:"4 eixos: vetor, reservatório, humano, educação"},
  "hepC-virus": {anchor:"#a6", label:"Vírus da hepatite C", subtopics:"Flaviviridae RNA, replicação citoplasmática"},
  "hepC-transmissao": {anchor:"#a6", label:"Transmissão da hepatite C", subtopics:"drogas injetáveis, biossegurança, transfusão pré-1993"},
  "hepC-aguda": {anchor:"#a6", label:"Hepatite C aguda", subtopics:"80% assintomática, icterícia &lt; 10%, fulminante raro"},
  "hepC-aguda-classif": {anchor:"#a6", label:"Definição de hepatite C aguda", subtopics:"soroconversão documentada, janela ≤ 90 dias"},
  "hepC-cronica": {anchor:"#a6", label:"Hepatite C crônica", subtopics:"75% cronificam, 20% cirrose, 2–5% CHC"},
  "hepC-cronica-riscos": {anchor:"#a6", label:"Fatores de risco para fibrose", subtopics:"idade &gt; 40 a, álcool, HIV, VHB, esteatose"},
  "hepC-diag": {anchor:"#a6", label:"Diagnóstico da hepatite C", subtopics:"anti-HCV (triagem) → HCV-RNA (confirmação/ativo)"},
  "hepC-tratamento": {anchor:"#a6", label:"Tratamento da hepatite C", subtopics:"sofosbuvir + velpatasvir, 12 ou 24 sem, cura &gt; 97%"},
  "hepC-ciclo": {anchor:"#a6", label:"Ciclo e cura esterilizante", subtopics:"sem integração ao DNA; não reativa; reinfecta"},
  "hepC-vigilancia": {anchor:"#a6", label:"Vigilância pós-cura", subtopics:"cirrótico mantém rastreio CHC; sorologia não é critério"}
};

const AULAS_INFO = {
  a1: {num:1, titulo:"Epidemiologia"},
  a2: {num:2, titulo:"FOI"},
  a3: {num:3, titulo:"Hepatites e Cirrose"},
  a4: {num:4, titulo:"Hepatite A"},
  a5: {num:5, titulo:"Leishmaniose"},
  a6: {num:6, titulo:"Hepatite C"}
};

// ========= RUNTIME =========
let mode = 'estudo';
let filter = 'todas';
const answers = {}; // qid -> selected index

function render() {
  const qList = document.getElementById('questList');
  const dList = document.getElementById('dissList');
  const idx = document.getElementById('idxContent');
  qList.innerHTML = ''; dList.innerHTML = ''; idx.innerHTML = '';

  // Indexador
  const byAula = {};
  QUESTOES.forEach(q => { (byAula[q.aula] ||= []).push(q); });
  Object.keys(AULAS_INFO).forEach(a => {
    const info = AULAS_INFO[a];
    const qs = byAula[a] || [];
    const div = document.createElement('div');
    div.style.marginBottom = '6px';
    div.innerHTML = `<strong>Aula ${info.num} — ${info.titulo}</strong><br>`;
    qs.forEach(q => {
      const link = document.createElement('a');
      link.href = '#q-' + q.id;
      link.textContent = `Q${q.id}`;
      div.appendChild(link);
    });
    idx.appendChild(div);
  });

  // Questões
  let currentAula = null;
  const qs = QUESTOES.filter(q => filter === 'todas' || q.aula === filter);
  qs.forEach(q => {
    if (q.aula !== currentAula) {
      currentAula = q.aula;
      const sep = document.createElement('h2');
      sep.className = 'aula-sep';
      sep.textContent = `Aula ${AULAS_INFO[q.aula].num} — ${AULAS_INFO[q.aula].titulo}`;
      qList.appendChild(sep);
    }
    qList.appendChild(renderQuestao(q));
  });

  // Dissertativas
  const ds = DISSERTATIVAS.filter(d => filter === 'todas' || d.aula === filter);
  if (ds.length === 0) {
    dList.innerHTML = '<p style="color:var(--text-muted);">Sem dissertativas para este filtro.</p>';
  } else {
    ds.forEach(d => dList.appendChild(renderDissertativa(d)));
  }
}

function renderQuestao(q) {
  const div = document.createElement('div');
  div.className = 'quest';
  div.id = 'q-' + q.id;
  const difClass = q.dif;
  const difLabel = {facil:'Fácil', medio:'Médio', dificil:'Difícil'}[q.dif];
  const aulaLabel = `Aula ${AULAS_INFO[q.aula].num}`;
  const alts = q.alts.map((a, i) => {
    const letter = String.fromCharCode(65 + i);
    return `<li><label data-idx="${i}"><input type="radio" name="q${q.id}" value="${i}"><span class="letter">${letter})</span><span>${a}</span></label></li>`;
  }).join('');
  const expWrongs = q.exp.wrongs.map((w, i) => {
    const letter = String.fromCharCode(65 + i);
    const cls = i === q.correct ? 'e-correct' : 'e-wrong';
    return `<p><span class="${cls}">${letter})</span> ${w}</p>`;
  }).join('');
  div.innerHTML = `
    <div class="qmeta">
      <span><span class="num">Q${q.id}</span> · ${aulaLabel}</span>
      <span class="dif ${difClass}">${difLabel}</span>
    </div>
    <div class="stem"><p>${q.stem}</p></div>
    <ul class="alts">${alts}</ul>
    <div class="explain">
      <h4>Por que a correta é correta</h4>
      <p>${q.exp.correct}</p>
      <h4>Por que cada errada está errada</h4>
      ${expWrongs}
    </div>`;
  const labels = div.querySelectorAll('.alts label');
  labels.forEach(lbl => {
    lbl.addEventListener('click', (e) => {
      if (div.classList.contains('answered') && mode === 'estudo') return;
      if (div.classList.contains('answered-sim') && mode === 'simulado') {} // allow change in simulado until submit
      const idx = parseInt(lbl.dataset.idx);
      answers[q.id] = idx;
      lbl.querySelector('input').checked = true;
      if (mode === 'estudo') markQuestao(div, q);
      else {
        // highlight chosen but no feedback
        labels.forEach(l => l.classList.remove('chosen'));
        lbl.classList.add('chosen');
      }
    });
  });
  return div;
}

function markQuestao(div, q) {
  div.classList.add('answered');
  const labels = div.querySelectorAll('.alts label');
  const selIdx = answers[q.id];
  labels.forEach((lbl, i) => {
    lbl.classList.remove('chosen');
    if (i === selIdx) lbl.classList.add('chosen');
    if (i === q.correct) lbl.classList.add('correct');
    else if (i === selIdx && i !== q.correct) lbl.classList.add('wrong');
  });
}

function renderDissertativa(d) {
  const div = document.createElement('div');
  div.className = 'diss';
  div.id = 'd-' + d.id;
  const aulaLabel = `Aula ${AULAS_INFO[d.aula].num}`;
  const perguntas = d.perguntas.map(p => `<li>${p}</li>`).join('');
  const modeloItems = d.modelo.map(m => `<p>${m}</p>`).join('');
  div.innerHTML = `
    <div class="qmeta"><span class="num">${d.id.toUpperCase()}</span> · ${aulaLabel} · Dissertativa</div>
    <h3 style="margin:2px 0 10px;">${d.title}</h3>
    <div class="caso"><p>${d.caso}</p></div>
    <ol class="perguntas">${perguntas}</ol>
    <button class="reveal-btn" onclick="this.parentElement.classList.toggle('revealed'); this.textContent = this.parentElement.classList.contains('revealed') ? 'Ocultar gabarito' : 'Revelar gabarito modelo';">Revelar gabarito modelo</button>
    <div class="gabarito">
      <h4>Resposta modelo — pontos-chave esperados</h4>
      ${modeloItems}
    </div>`;
  return div;
}

function setMode(m) {
  mode = m;
  const banner = document.getElementById('modeBanner');
  const submitBtn = document.getElementById('submitBtn');
  const resultsDiv = document.getElementById('simResults');
  resultsDiv.classList.remove('show');
  if (m === 'estudo') {
    banner.textContent = 'Modo Estudo — responda cada questão e o feedback aparece na hora.';
    submitBtn.classList.add('hidden');
  } else {
    banner.textContent = 'Modo Simulado — responda todas; ao final, clique em Finalizar para ver pontuação e painel de diagnóstico.';
    submitBtn.classList.remove('hidden');
  }
  // reset visual
  document.querySelectorAll('.quest').forEach(d => { d.classList.remove('answered'); d.querySelectorAll('label').forEach(l => l.classList.remove('chosen','correct','wrong')); });
  // clear answers if changing mode (but keep selection for convenience)
  if (m === 'estudo') {
    // reaplica marcação das que já foram respondidas
    Object.keys(answers).forEach(id => {
      const q = QUESTOES.find(x => x.id === parseInt(id));
      const div = document.getElementById('q-' + id);
      if (div && q) markQuestao(div, q);
    });
  } else {
    // mostrar apenas chosen, sem feedback
    Object.keys(answers).forEach(id => {
      const idx = answers[id];
      const div = document.getElementById('q-' + id);
      if (div) {
        const lbl = div.querySelectorAll('.alts label')[idx];
        if (lbl) lbl.classList.add('chosen');
      }
    });
  }
}

function submitSim() {
  const results = document.getElementById('simResults');
  const totalQ = QUESTOES.length;
  let correct = 0, answered = 0;
  const byAula = {}; const byDif = {}; const byTopic = {};
  QUESTOES.forEach(q => {
    byAula[q.aula] = byAula[q.aula] || {c:0,t:0};
    byDif[q.dif] = byDif[q.dif] || {c:0,t:0};
    byTopic[q.topic] = byTopic[q.topic] || {c:0,t:0,errors:[]};
    byAula[q.aula].t++; byDif[q.dif].t++; byTopic[q.topic].t++;
    if (answers[q.id] !== undefined) {
      answered++;
      if (answers[q.id] === q.correct) {
        correct++;
        byAula[q.aula].c++; byDif[q.dif].c++; byTopic[q.topic].c++;
      } else {
        byTopic[q.topic].errors.push(q.id);
      }
    }
  });
  // marcar visualmente
  QUESTOES.forEach(q => {
    const div = document.getElementById('q-' + q.id);
    if (div) markQuestao(div, q);
  });

  const pct = totalQ > 0 ? Math.round(correct*100/totalQ) : 0;
  let aulaHtml = '';
  Object.keys(byAula).forEach(a => {
    const b = byAula[a];
    const p = b.t > 0 ? Math.round(b.c*100/b.t) : 0;
    aulaHtml += `<div class="box"><strong>Aula ${AULAS_INFO[a].num} — ${AULAS_INFO[a].titulo}</strong>${b.c}/${b.t} (${p}%)</div>`;
  });
  let difHtml = '';
  Object.keys(byDif).forEach(d => {
    const b = byDif[d];
    const p = b.t > 0 ? Math.round(b.c*100/b.t) : 0;
    difHtml += `<div class="box"><strong>${d.charAt(0).toUpperCase()+d.slice(1)}</strong>${b.c}/${b.t} (${p}%)</div>`;
  });

  // Painel de diagnóstico por tópico
  const weak = [];
  Object.keys(byTopic).forEach(t => {
    const b = byTopic[t];
    if (b.t === 0) return;
    const p = Math.round(b.c*100/b.t);
    if (p < 100) weak.push({topic:t, c:b.c, t:b.t, pct:p, errors:b.errors});
  });
  weak.sort((a, b) => a.pct - b.pct);
  let diagHtml = '<p style="color:var(--text-muted);">Nenhuma lacuna identificada. Parabéns!</p>';
  if (weak.length > 0) {
    diagHtml = weak.map(w => {
      const icon = w.pct < 50 ? '🔴' : '🟡';
      const info = topicToResumo[w.topic] || {anchor:'', label:w.topic, subtopics:''};
      const link = info.anchor ? `<a href="${RESUMAO_BASE}${info.anchor}" style="color:var(--accent);text-decoration:none;font-weight:600;">→ Revisar no resumão</a>` : '';
      return `<div class="item"><div class="top"><b>${icon} ${info.label}</b><span>${w.c}/${w.t} (${w.pct}%)</span></div><div class="sub">${info.subtopics} ${link ? ' · ' + link : ''}</div></div>`;
    }).join('');
  }

  results.innerHTML = `
    <h2>Resultado do simulado</h2>
    <div class="score">${correct}/${totalQ} (${pct}%)</div>
    <p style="color:var(--text-dim);">Respondidas: ${answered} de ${totalQ}</p>
    <h3 style="margin:16px 0 6px;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;">Por aula</h3>
    <div class="score-breakdown">${aulaHtml}</div>
    <h3 style="margin:16px 0 6px;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;">Por dificuldade</h3>
    <div class="score-breakdown">${difHtml}</div>
    <div class="diag-panel">
      <h3>Painel de diagnóstico — tópicos a revisar</h3>
      ${diagHtml}
    </div>`;
  results.classList.add('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

function resetAll() {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll('.quest').forEach(d => {
    d.classList.remove('answered');
    d.querySelectorAll('label').forEach(l => l.classList.remove('chosen','correct','wrong'));
    d.querySelectorAll('input').forEach(i => i.checked = false);
  });
  document.getElementById('simResults').classList.remove('show');
}

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const btn = document.getElementById('themeBtn');
  if (cur === 'light') { root.removeAttribute('data-theme'); btn.textContent = '☾ Tema claro'; localStorage.setItem('theme','dark'); }
  else { root.setAttribute('data-theme','light'); btn.textContent = '☀ Tema escuro'; localStorage.setItem('theme','light'); }
}
(function(){
  const saved = localStorage.getItem('theme');
  if (saved === 'light') { document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeBtn').textContent = '☀ Tema escuro'; }
})();

document.getElementById('modeSel').addEventListener('change', e => setMode(e.target.value));
document.getElementById('filterSel').addEventListener('change', e => { filter = e.target.value; render(); });
document.getElementById('applyBtn').addEventListener('click', () => render());
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('submitBtn').addEventListener('click', submitSim);

render();
</script>

</body>
