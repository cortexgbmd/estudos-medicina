<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECORAR — Farmacologia P4 (1 dia)</title>
<style>
  :root{--bg:#0f1220;--panel:#1a1f33;--panel2:#222a44;--txt:#e8ecf8;--muted:#9aa3c0;--accent:#6ea8fe;--green:#36c98a;--yellow:#f0b429;--red:#f06a6a;--line:#2c3556}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:780px;padding:18px 16px 6px;display:flex;flex-direction:column;gap:10px}
  h1{font-size:18px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:12.5px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none}
  .stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .stats b{color:var(--txt)}
  .bar{height:7px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--accent));width:0%;transition:width .3s}
  main{width:100%;max-width:780px;padding:8px 16px 90px;flex:1;display:flex;flex-direction:column}
  .card{background:linear-gradient(180deg,var(--panel),#171c2e);border:1px solid var(--line);border-radius:18px;padding:26px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:16px;cursor:pointer;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:rgba(110,168,254,.12);border:1px solid rgba(110,168,254,.3);padding:3px 9px;border-radius:99px}
  .front{font-size:21px;font-weight:700;line-height:1.35}
  .hint{color:var(--muted);font-size:12.5px}
  .back{display:none}
  .card.flipped .back{display:block;border-top:1px dashed var(--line);padding-top:14px;font-size:18px;line-height:1.5}
  .card.flipped .front{font-size:18px;color:var(--muted);font-weight:600}
  .rate{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,transparent,rgba(15,18,32,.92) 28%);backdrop-filter:blur(4px)}
  .rate button{flex:1;max-width:220px;border:none;border-radius:12px;padding:14px 10px;font-size:15px;font-weight:700;color:#0c1020;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .rate small{font-weight:600;font-size:11px;opacity:.75}
  .b-red{background:var(--red)}.b-yellow{background:var(--yellow)}.b-green{background:var(--green)}
  .mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
  .done{text-align:center;padding:40px 10px;color:var(--muted)}.done b{color:var(--green);font-size:22px;display:block;margin-bottom:8px}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
  b{color:#8fd0ff}
</style>
</head>
<body>
<header>
  <div><h1>DECORAR fármacos — 1 dia</h1>
  <div class="sub">Cada fármaco = 1 carta (nome → ação · efeitos · uso). Erra → volta logo · fácil → vai pro fim. <kbd>espaço</kbd> vira · <kbd>1</kbd> errei · <kbd>2</kbd> quase · <kbd>3</kbd> fácil<br><span style="color:#36c98a;font-weight:600">💾 seu progresso é salvo automaticamente neste navegador</span></div></div>
  <div class="controls">
    <select id="deck"></select>
    <label class="chk"><input type="checkbox" id="retire" checked> tirar quando decorar (2× fácil)</label>
    <button class="mini" id="resetBtn">reiniciar</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar"><i id="prog"></i></div>
</header>
<main><div id="cardWrap"></div></main>
<div class="rate" id="rateBar" style="display:none">
  <button class="b-red" data-r="0">Errei<small>volta já</small></button>
  <button class="b-yellow" data-r="1">Quase<small>volta logo</small></button>
  <button class="b-green" data-r="2">Fácil<small>vai pro fim</small></button>
</div>
<script>
const CARDS=[{"deck": "1 · Anti-HAS", "f": "Captopril / Enalapril (IECA)", "b": "<b>Ação:</b> Inibe a ECA → ↓angiotensina II e ↑bradicinina<br><b>Efeitos adversos:</b> Tosse seca; hipercalemia<br><b>Uso:</b> HAS e IC"}, {"deck": "1 · Anti-HAS", "f": "Losartana (BRA)", "b": "<b>Ação:</b> Bloqueia o receptor AT₁ (não dá tosse)<br><b>Efeitos adversos:</b> Hipercalemia; hipotensão<br><b>Uso:</b> HAS quando o IECA dá tosse"}, {"deck": "1 · Anti-HAS", "f": "Anlodipino (BCC di-hidro)", "b": "<b>Ação:</b> Bloqueia canal de Ca²⁺ vascular → vasodilatação<br><b>Efeitos adversos:</b> Edema de MMII; cefaleia<br><b>Uso:</b> HAS (preferido, SUS)"}, {"deck": "1 · Anti-HAS", "f": "Nifedipino (BCC di-hidro)", "b": "<b>Ação:</b> Vasodilatação arterial intensa<br><b>Efeitos adversos:</b> Taquicardia reflexa; edema<br><b>Uso:</b> HAS / angina estável"}, {"deck": "1 · Anti-HAS", "f": "Verapamil / Diltiazem (BCC não-DHP)", "b": "<b>Ação:</b> Bloqueia Ca²⁺ cardíaco → ↓FC e condução AV<br><b>Efeitos adversos:</b> Bradicardia/BAV; constipação<br><b>Uso:</b> Controle de FC / angina"}, {"deck": "1 · Anti-HAS", "f": "Propranolol (β-bloq não seletivo)", "b": "<b>Ação:</b> Bloqueia β₁ e β₂<br><b>Efeitos adversos:</b> Broncoespasmo; bradicardia<br><b>Uso:</b> Cuidado no asmático"}, {"deck": "1 · Anti-HAS", "f": "Atenolol (β-bloq cardiosseletivo)", "b": "<b>Ação:</b> Bloqueia β₁<br><b>Efeitos adversos:</b> Bradicardia; fadiga<br><b>Uso:</b> HAS / angina (coronariopata)"}, {"deck": "1 · Anti-HAS", "f": "Metildopa (simpatolítico central)", "b": "<b>Ação:</b> Agonista α₂ central<br><b>Efeitos adversos:</b> Sonolência; anemia hemolítica (Coombs+)<br><b>Uso:</b> HAS na gestante"}, {"deck": "1 · Anti-HAS", "f": "Clonidina (simpatolítico central)", "b": "<b>Ação:</b> Agonista α₂ central<br><b>Efeitos adversos:</b> Sonolência; HAS rebote na retirada<br><b>Uso:</b> HAS resistente"}, {"deck": "1 · Anti-HAS", "f": "Hidralazina (vasodilatador direto)", "b": "<b>Ação:</b> Vasodilatador arteriolar direto<br><b>Efeitos adversos:</b> Taquicardia reflexa; lúpus-like<br><b>Uso:</b> HAS grave / eclâmpsia"}, {"deck": "1 · Anti-HAS", "f": "Prazosina / Doxazosina (α₁-bloqueador)", "b": "<b>Ação:</b> Bloqueiam α₁ → vasodilatação<br><b>Efeitos adversos:</b> Hipotensão de 1ª dose; tontura<br><b>Uso:</b> HAS + hiperplasia prostática (HPB)"}, {"deck": "2 · Diuréticos", "f": "Furosemida (alça – FORTE)", "b": "<b>Ação:</b> Inibe Na⁺/K⁺/2Cl⁻ na alça<br><b>Efeitos adversos:</b> Hipocalemia; ototoxicidade<br><b>Uso:</b> EAP / congestão na IC"}, {"deck": "2 · Diuréticos", "f": "Hidroclorotiazida / Clortalidona (tiazídico)", "b": "<b>Ação:</b> Inibe Na⁺/Cl⁻ no TCD inicial<br><b>Efeitos adversos:</b> Hipocalemia; hiperuricemia (gota)<br><b>Uso:</b> HAS"}, {"deck": "2 · Diuréticos", "f": "Espironolactona (poupador de K⁺)", "b": "<b>Ação:</b> Bloqueia o receptor de aldosterona<br><b>Efeitos adversos:</b> Hipercalemia; ginecomastia<br><b>Uso:</b> IC / hiperaldosteronismo"}, {"deck": "2 · Diuréticos", "f": "Amilorida / Triantereno (poupador de K⁺)", "b": "<b>Ação:</b> Bloqueiam o canal de sódio (ENaC)<br><b>Efeitos adversos:</b> Hipercalemia; distúrbio GI<br><b>Uso:</b> Associação (poupar K⁺)"}, {"deck": "2 · Diuréticos", "f": "Manitol (osmótico)", "b": "<b>Ação:</b> Diurese osmótica<br><b>Efeitos adversos:</b> Desidratação; expansão de volume<br><b>Uso:</b> Edema cerebral / glaucoma"}, {"deck": "2 · Diuréticos", "f": "Acetazolamida (anidrase carbônica)", "b": "<b>Ação:</b> ↓Reabsorção de bicarbonato no TCP<br><b>Efeitos adversos:</b> Acidose metabólica; hipocalemia<br><b>Uso:</b> Glaucoma"}, {"deck": "3 · Digitálicos / antiarrítmicos / nitratos", "f": "Digoxina", "b": "<b>Ação:</b> Inibe Na⁺/K⁺-ATPase → ↑contração + ↑vagal (↓FC)<br><b>Efeitos adversos:</b> Intoxicação (arritmia/bradicardia); visão amarelada<br><b>Uso:</b> IC + fibrilação atrial"}, {"deck": "3 · Digitálicos / antiarrítmicos / nitratos", "f": "Lidocaína (antiarrít. IB)", "b": "<b>Ação:</b> Bloqueia Na⁺ em tecido isquêmico<br><b>Efeitos adversos:</b> Neurotoxicidade (convulsão); confusão<br><b>Uso:</b> Arritmia ventricular (IAM)"}, {"deck": "3 · Digitálicos / antiarrítmicos / nitratos", "f": "Amiodarona (antiarrít. III)", "b": "<b>Ação:</b> Bloqueia K⁺ (prolonga refratário)<br><b>Efeitos adversos:</b> Disfunção tireoidiana; toxicidade pulmonar<br><b>Uso:</b> Arritmias graves (FA/TV)"}, {"deck": "3 · Digitálicos / antiarrítmicos / nitratos", "f": "Nitroglicerina (nitrato)", "b": "<b>Ação:</b> Doador de NO → vasodilatação (venosa>arterial)<br><b>Efeitos adversos:</b> Cefaleia; hipotensão<br><b>Uso:</b> Crise de angina / IAM"}, {"deck": "3 · Digitálicos / antiarrítmicos / nitratos", "f": "Mononitrato de isossorbida (nitrato)", "b": "<b>Ação:</b> Doador de NO<br><b>Efeitos adversos:</b> Cefaleia; tolerância<br><b>Uso:</b> Profilaxia da angina"}, {"deck": "4 · Dislipidemia", "f": "Estatinas (sinva → atorva → rosuva)", "b": "<b>Ação:</b> Inibem HMG-CoA redutase → ↓LDL<br><b>Efeitos adversos:</b> Mialgia/rabdomiólise; ↑transaminases<br><b>Uso:</b> Dislipidemia (↓LDL)"}, {"deck": "4 · Dislipidemia", "f": "Ezetimiba", "b": "<b>Ação:</b> Inibe absorção intestinal de colesterol (NPC1L1)<br><b>Efeitos adversos:</b> Diarreia; mialgia<br><b>Uso:</b> ↑LDL refratário (com estatina)"}, {"deck": "4 · Dislipidemia", "f": "Fenofibrato (fibrato)", "b": "<b>Ação:</b> Agonista PPAR-α → ↓triglicérides<br><b>Efeitos adversos:</b> Miopatia; arritmia (+varfarina!)<br><b>Uso:</b> Hipertrigliceridemia"}, {"deck": "5 · Antitrombóticos", "f": "AAS", "b": "<b>Ação:</b> Inibe COX-1 → ↓tromboxano A₂<br><b>Efeitos adversos:</b> Sangramento GI; dispepsia<br><b>Uso:</b> Prevenção 2ária / IAM"}, {"deck": "5 · Antitrombóticos", "f": "Clopidogrel", "b": "<b>Ação:</b> Bloqueia P2Y₁₂ do ADP<br><b>Efeitos adversos:</b> Sangramento; diarreia<br><b>Uso:</b> Dupla antiagregação (stent)"}, {"deck": "5 · Antitrombóticos", "f": "Ticlopidina", "b": "<b>Ação:</b> Bloqueia P2Y₁₂ do ADP<br><b>Efeitos adversos:</b> Neutropenia; PTT<br><b>Uso:</b> Stent (alternativa)"}, {"deck": "5 · Antitrombóticos", "f": "Dipiridamol", "b": "<b>Ação:</b> Inibe PDE + capta adenosina<br><b>Efeitos adversos:</b> Cefaleia; hipotensão<br><b>Uso:</b> Prótese valvar (com AAS/varfarina)"}, {"deck": "5 · Antitrombóticos", "f": "Heparina", "b": "<b>Ação:</b> Potencializa a antitrombina<br><b>Efeitos adversos:</b> Hemorragia; trombocitopenia (HIT)<br><b>Uso:</b> Agudo / gestante (antídoto: protamina)"}, {"deck": "5 · Antitrombóticos", "f": "Varfarina", "b": "<b>Ação:</b> Antagonista da vitamina K (II,VII,IX,X)<br><b>Efeitos adversos:</b> Hemorragia; teratogenicidade<br><b>Uso:</b> Crônico / válvula mecânica (INR 2–3)"}, {"deck": "5 · Antitrombóticos", "f": "Rivaroxabana (DOAC)", "b": "<b>Ação:</b> Inibe o fator Xa<br><b>Efeitos adversos:</b> Hemorragia; anemia<br><b>Uso:</b> FA não valvar / TEV"}, {"deck": "5 · Antitrombóticos", "f": "Estreptoquinase / Alteplase (fibrinolítico)", "b": "<b>Ação:</b> Ativam o plasminogênio<br><b>Efeitos adversos:</b> Hemorragia; AVC hemorrágico<br><b>Uso:</b> Trombólise no IAM (janela: 8 h na aula / 12 h na diretriz)"}, {"deck": "6 · Vasoativos", "f": "Dobutamina", "b": "<b>Ação:</b> Agonista β₁<br><b>Efeitos adversos:</b> Taquicardia; arritmia<br><b>Uso:</b> Choque cardiogênico"}, {"deck": "6 · Vasoativos", "f": "Dopamina", "b": "<b>Ação:</b> Dose-dependente (dopa→β→α)<br><b>Efeitos adversos:</b> Taquiarritmia; isquemia<br><b>Uso:</b> Choque"}, {"deck": "6 · Vasoativos", "f": "Adrenalina", "b": "<b>Ação:</b> Agonista α e β<br><b>Efeitos adversos:</b> Taquiarritmia; hipertensão<br><b>Uso:</b> PCR / anafilaxia"}, {"deck": "6 · Vasoativos", "f": "Noradrenalina", "b": "<b>Ação:</b> Agonista α₁ (vasopressor)<br><b>Efeitos adversos:</b> Isquemia periférica; bradicardia reflexa<br><b>Uso:</b> Choque séptico"}, {"deck": "6 · Vasoativos", "f": "Nitroprussiato", "b": "<b>Ação:</b> Doador de NO (arterial+venoso)<br><b>Efeitos adversos:</b> Toxicidade por cianeto; hipotensão<br><b>Uso:</b> Emergência hipertensiva"}, {"deck": "7 · Hipoglicemiantes", "f": "Metformina (biguanida)", "b": "<b>Ação:</b> ↓Gliconeogênese hepática, ↑sensibilidade<br><b>Efeitos adversos:</b> Distúrbios GI; acidose lática<br><b>Uso:</b> DM2 — 1ª linha"}, {"deck": "7 · Hipoglicemiantes", "f": "Glibenclamida (sulfonilureia)", "b": "<b>Ação:</b> Fecha canal de K⁺ → ↑insulina<br><b>Efeitos adversos:</b> Hipoglicemia; ganho de peso<br><b>Uso:</b> DM2 (maior hipoglicemia)"}, {"deck": "7 · Hipoglicemiantes", "f": "Repaglinida / Nateglinida (glinida)", "b": "<b>Ação:</b> Fecham canal de K⁺ (rápido)<br><b>Efeitos adversos:</b> Hipoglicemia; ganho de peso<br><b>Uso:</b> Hiperglicemia pós-prandial"}, {"deck": "7 · Hipoglicemiantes", "f": "Pioglitazona (glitazona)", "b": "<b>Ação:</b> Agonista PPAR-γ → ↑sensibilidade<br><b>Efeitos adversos:</b> Retenção hídrica (piora IC); hepato<br><b>Uso:</b> DM2 com esteatose hepática"}, {"deck": "7 · Hipoglicemiantes", "f": "Acarbose", "b": "<b>Ação:</b> Inibe a α-glicosidase<br><b>Efeitos adversos:</b> Flatulência; diarreia<br><b>Uso:</b> Pós-prandial / ↓íntima carótida"}, {"deck": "7 · Hipoglicemiantes", "f": "Vildagliptina (gliptina/DPP-4)", "b": "<b>Ação:</b> Inibe a DPP-4 → ↑GLP-1<br><b>Efeitos adversos:</b> Cefaleia; náusea<br><b>Uso:</b> DM2 (sem hipoglicemia)"}, {"deck": "7 · Hipoglicemiantes", "f": "Liraglutida / Semaglutida (GLP-1)", "b": "<b>Ação:</b> Agonista GLP-1 → ↑insulina, ↓fome<br><b>Efeitos adversos:</b> Náusea; vômito<br><b>Uso:</b> DM2 com obesidade"}, {"deck": "7 · Hipoglicemiantes", "f": "Dapagliflozina (SGLT2)", "b": "<b>Ação:</b> Bloqueia reabsorção renal de glicose<br><b>Efeitos adversos:</b> Infecção genitourinária; depleção volume<br><b>Uso:</b> DM2 com IC / renal"}, {"deck": "7 · Hipoglicemiantes", "f": "Insulinas (Lispro/Regular/NPH/Glargina)", "b": "<b>Ação:</b> Repõem insulina<br><b>Efeitos adversos:</b> Hipoglicemia; ganho de peso<br><b>Uso:</b> Lispro=bolus; Regular=IV/cetoacidose; NPH=basal SUS; Glargina=basal (menos hipoglic.)"}, {"deck": "⭐ Pegadinhas & escolhas", "f": "IECA causou tosse seca → qual trocar?", "b": "Losartana (BRA) — não mexe na bradicinina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "HAS na gestante (crônica / emergência)?", "b": "Crônica: metildopa. Eclâmpsia/emergência: hidralazina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "IC + fibrilação atrial → qual?", "b": "Digoxina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "DM2 + IC ou doença renal → 2º fármaco?", "b": "Dapagliflozina (SGLT2)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "DM2 + obesidade → 2º fármaco?", "b": "Análogo de GLP-1 (liraglutida/semaglutida)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "DM2 + esteatose hepática → qual?", "b": "Pioglitazona."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Anticoagulação: válvula mecânica?", "b": "Varfarina (INR 2–3)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Anticoagulação: FA não valvar?", "b": "DOAC (rivaroxabana)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Anticoagulação na gestante?", "b": "Heparina (varfarina é teratogênica)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Choque: séptico / cardiogênico / PCR?", "b": "Séptico→noradrenalina; cardiogênico→dobutamina; PCR→adrenalina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Emergência hipertensiva (IV)?", "b": "Nitroprussiato."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Antídotos: opioide / hipertermia maligna / β-bloq / heparina?", "b": "Naloxona / dantroleno / glucagon / protamina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Captopril — efeito adverso eletrolítico?", "b": "HIPERcalemia (não hipocalemia)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Diurético que causa gota?", "b": "Tiazídico (hidroclorotiazida) — hiperuricemia."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Por que diurético depletor de K⁺ reduz o hipoglicemiante oral?", "b": "Hipocalemia hiperpolariza a célula β → libera menos insulina."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "O que a DPP-4 faz com o GLP-1?", "b": "DEGRADA — por isso o inibidor de DPP-4 aumenta o GLP-1."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Edoxabana — mecanismo?", "b": "Inibidor do FATOR Xa (não de trombina; trombina = dabigatrana)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Antiagregante que dá neutropenia + PTT?", "b": "Ticlopidina (não o clopidogrel)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Hipoglicemiante oral de maior risco de hipoglicemia?", "b": "Sulfonilureia (glibenclamida/clorpropamida)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Estatina + fibrato → risco?", "b": "Rabdomiólise."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Antiarrítmico de classe IV?", "b": "Verapamil / diltiazem."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "BCC na taquiarritmia — sempre com o quê?", "b": "Beta-bloqueador (cai na prova)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Adrenalina dose baixa × alta?", "b": "Baixa = β (vasodilata/↑FC); alta = α (vasoconstrição/HAS)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Potência diurética por sítio?", "b": "Proximal fraco → alça FORTE → distal inicial moderado → distal final fraco."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Intoxicação digitálica — o que potencializa e conduta?", "b": "Hipocalemia potencializa; conduta = repor potássio."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] Estatina serve para evitar o quê?", "b": "↓LDL e estabiliza a placa; uso CONTÍNUO."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] Classificar a PA quando sistólica e diastólica divergem?", "b": "Pelo estágio MAIS ALTO. Ex.: 160/110 = estágio 3."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] Fluxograma da HAS — combinações válidas?", "b": "Tiazídico + (IECA OU BRA OU BCC OU beta-bloq). Monoterapia → associa 2ª → 3ª droga."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] Escore de risco cardiovascular — o que é?", "b": "Framingham: risco de doença cardiovascular em 10 anos (baixo: menos de 10%; médio: 10 a 20%; alto: mais de 20%)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] α₁-bloqueador (prazosina/doxazosina) — uso que ele perguntou na prova?", "b": "Hiperplasia prostática benigna (relaxa o trato geniturinário; ajuda a expulsar cálculo)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "[EXPLÍCITO] No bloqueio do SRAA, a queda de pressão depende mais de quê?", "b": "Da vasoconstrição direta da angiotensina II (mais que da aldosterona)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Fases do potencial de ação cardíaco (questão clássica de fisiologia)", "b": "0 = entra Na⁺; 1 = sai K⁺; 2 = platô (entra Ca²⁺); 3 = sai K⁺; 4 = repouso."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Beta-bloqueador na IC — por que ajuda? (discursiva)", "b": "Bloqueia a hiperativação simpática crônica → ↓consumo de O₂ e remodelamento → ↑sobrevida (iniciar em dose baixa)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "SRAA — nas adrenais a angiotensina II estimula o quê? (pegadinha)", "b": "Aldosterona (NÃO o ADH)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Vildagliptina — 2 efeitos benéficos (discursiva)", "b": "Baixo risco de hipoglicemia (glicose-dependente) e neutralidade no peso (não engorda)."}, {"deck": "⭐ Pegadinhas & escolhas", "f": "Glitazona (pioglitazona) — 2 efeitos benéficos (discursiva)", "b": "Melhora a esteatose hepática (NASH) e não causa hipoglicemia (↑HDL e ↓TG, mas pode ↑LDL)."}];
CARDS.forEach((c,i)=>c.id=i);
let state, deckFilter="Todos", retire=true, flipped=false, queue=[];
function fresh(){return CARDS.map(()=>({streak:0,seen:0,ok:0}))}
const SKEY="cram_"+(document.title||"deck").replace(/\W+/g,"_");
function save(){try{localStorage.setItem(SKEY,JSON.stringify({state,retire,v:1}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.state&&s.state.length===CARDS.length)return s}catch(e){}return null}
function buildQueue(){let ids=CARDS.filter(c=>(deckFilter==="Todos"||c.deck===deckFilter)&&!(retire&&state[c.id]&&state[c.id].streak>=2)).map(c=>c.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}return ids}
function init(saved){if(saved){state=saved.state;retire=saved.retire;const rc=document.getElementById("retire");if(rc)rc.checked=retire}else{state=fresh()}queue=buildQueue();flipped=false;render();save()}
function cur(){return queue.length?queue[0]:null}
function render(){
  const wrap=document.getElementById("cardWrap"),rb=document.getElementById("rateBar");
  stats();
  if(!queue.length){rb.style.display="none";document.getElementById("prog").style.width="100%";
    wrap.innerHTML=`<div class="done"><b>Fila zerada 🎉</b>Você decorou tudo do filtro atual.<br><br><button class="mini" style="padding:12px 18px" onclick="init()">Recomeçar rodada</button></div>`;return}
  const c=CARDS[cur()];
  wrap.innerHTML=`<div class="card ${flipped?'flipped':''}" id="card"><span class="tag">${c.deck}</span>
    <div class="front">${c.f}</div>
    <div class="back">${c.b}</div>
    ${flipped?'':'<div class="hint">toque ou aperte espaço para a resposta</div>'}</div>`;
  document.getElementById("card").onclick=flip;
  rb.style.display=flipped?"flex":"none";
}
function flip(){if(!queue.length)return;flipped=!flipped;render()}
function rate(r){if(!flipped||!queue.length)return;const id=queue.shift(),st=state[id];
  st.seen++;if(r===2){st.ok++;st.streak++}else st.streak=0;
  if(!(r===2&&retire&&st.streak>=2)){let gap=r===0?2:r===1?6:16;gap+=Math.floor(Math.random()*3);queue.splice(Math.min(gap,queue.length),0,id)}
  save();flipped=false;render()}
function stats(){const tot=CARDS.filter(c=>deckFilter==="Todos"||c.deck===deckFilter).length;
  const dec=state.filter((s,i)=>(deckFilter==="Todos"||CARDS[i].deck===deckFilter)&&s.streak>=2).length;
  const reps=state.reduce((a,s)=>a+s.seen,0),ok=state.reduce((a,s)=>a+s.ok,0),acc=reps?Math.round(ok/reps*100):0;
  document.getElementById("stats").innerHTML=`Na fila: <b>${queue.length}</b> · Decoradas: <b>${dec}/${tot}</b> · Repetições: <b>${reps}</b> · Acerto: <b>${acc}%</b>`;
  document.getElementById("prog").style.width=(tot?dec/tot*100:0)+"%"}
const ds=document.getElementById("deck"),groups=["Todos",...[...new Set(CARDS.map(c=>c.deck))]];
ds.innerHTML=groups.map(g=>`<option value="${g}">${g}${g==="Todos"?` (${CARDS.length})`:` (${CARDS.filter(c=>c.deck===g).length})`}</option>`).join("");
ds.onchange=e=>{deckFilter=e.target.value;queue=buildQueue();flipped=false;render()};
document.getElementById("retire").onchange=e=>{retire=e.target.checked;queue=buildQueue();save();flipped=false;render()};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reiniciar TODO o progresso salvo? As cartas decoradas voltam pra fila. Não dá pra desfazer.")){try{localStorage.setItem(SKEY+"_bak",localStorage.getItem(SKEY)||"")}catch(e){}localStorage.removeItem(SKEY);init(null)}};
document.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();if(!flipped)flip()}if(flipped){if(e.key==="1")rate(0);if(e.key==="2")rate(1);if(e.key==="3")rate(2)}});
init(load());
</script>
